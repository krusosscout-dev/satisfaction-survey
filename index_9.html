<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>แบบประเมินความพึงพอใจต่อสื่อ</title>
<!--
  ระบบประเมินความพึงพอใจของผู้เรียนที่มีต่อสื่อ (ไฟล์เดียว สำหรับ Vercel + Firebase)
  ดูวิธีติดตั้งในไฟล์ คู่มือติดตั้ง.md
  ลิงก์นักเรียน:  https://โดเมน/?m=รหัสสื่อ&n=ชื่อสื่อ&r=ห้อง   (สร้างได้จากหน้าผู้ดูแล)
  หน้าผู้ดูแล:    https://โดเมน/#admin
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap">
<style>
/* Layout: ขั้นตอนทีละหน้า (หน้าแรก → ข้อมูล → 3 ด้าน → ความคิดเห็น) คอลัมน์เดียว / หน้าผู้ดูแลเป็นรายงานแบบเอกสาร */
:root{
  --bg:#f2f4f5; --surface:#ffffff; --ink:#18242b; --muted:#5b6b74; --line:#d5dde1; --track:#e8edf0;
  --accent:#0f6e78; --accent-ink:#ffffff;
  --d1:#0f766e; --d2:#4053c9; --d3:#c05a0c; --d4:#7a4fa3;
  --th:#dbe5f1; --dimrow:#f2f2f2; --sumrow:#fbf6e3;
  --good:#2e7d4f; --bad:#b3362f; --warn:#a46200;
  --display:"Anuphan","Leelawadee UI","Tahoma",system-ui,sans-serif;
  --body:"Anuphan","Leelawadee UI","Tahoma",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10171b; --surface:#172228; --ink:#e4ebef; --muted:#9caab2; --line:#2b3941; --track:#24323a;
  --accent:#52b6bf; --accent-ink:#0b1a1d;
  --d1:#3cbfb2; --d2:#8b9bff; --d3:#f09a52; --d4:#b993dc;
  --th:#1f2f40; --dimrow:#1d2a31; --sumrow:#2c2a1d;
  --good:#6cc28f; --bad:#ec7d75; --warn:#e3a54a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10171b; --surface:#172228; --ink:#e4ebef; --muted:#9caab2; --line:#2b3941; --track:#24323a;
  --accent:#52b6bf; --accent-ink:#0b1a1d;
  --d1:#3cbfb2; --d2:#8b9bff; --d3:#f09a52; --d4:#b993dc;
  --th:#1f2f40; --dimrow:#1d2a31; --sumrow:#2c2a1d;
  --good:#6cc28f; --bad:#ec7d75; --warn:#e3a54a; color-scheme:dark}

*{box-sizing:border-box}
button,input,select,textarea,code{font-family:var(--body)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.65 var(--body);padding:0 16px}
.wrap{max-width:760px;margin:0 auto;padding-block:24px 40px;display:grid;gap:18px}
.wrap.wide{max-width:980px}
h1,h2,h3{font-family:var(--display);line-height:1.35;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:1.65rem} h2{font-size:1.2rem} h3{font-size:1.02rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.88rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.banner{border:1px dashed var(--warn);color:var(--warn);border-radius:10px;padding:8px 14px;font-size:.9rem}
.eyebrow{font-size:.8rem;letter-spacing:.05em;color:var(--accent);font-weight:600}
button,.btn{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;text-decoration:none}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
textarea{resize:vertical}
label.f{display:grid;gap:6px;font-weight:600}
label.f .hint{font-weight:400;color:var(--muted);font-size:.86rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.foot{text-align:center;font-size:.85rem} .foot a{color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;font-size:.92rem;z-index:20}

/* ---------- หน้าแรก ---------- */
.hero{display:grid;gap:14px;padding-block:18px 4px}
.media-name{font-family:var(--display);font-weight:700;font-size:clamp(1.4rem,4.5vw,1.9rem);line-height:1.4;text-wrap:balance}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.88rem;background:var(--surface)}
.chip b{font-weight:600}
.plan{display:grid;gap:4px}
.plan-item{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.plan-item:last-child{border-bottom:0}
.plan-dot{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--surface);background:var(--dc)}

/* ---------- ตัวบอกขั้นตอน ---------- */
.stepper{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:grid;gap:6px}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.segs i{height:6px;border-radius:3px;background:var(--track)}
.step-label{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);gap:10px}
.step-label b{color:var(--ink);font-weight:600}

/* ---------- หัวด้าน ---------- */
.dimhead{border-radius:16px;padding:18px 20px;color:var(--surface);background:var(--dc);display:grid;grid-template-columns:auto 1fr;gap:2px 16px;align-items:center}
.dimhead .num{grid-row:span 2;font-family:var(--display);font-size:2.6rem;font-weight:700;line-height:1;opacity:.9}
.dimhead h2{font-size:1.3rem;color:inherit}
.dimhead p{opacity:.92;font-size:.9rem}

/* ---------- การ์ดคำถาม + มาตรวัด ---------- */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:14px;transition:border-color .2s}
.qcard.missing{border-color:var(--bad)}
.qhead{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.qno{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.95rem;border:2px solid var(--dc);color:var(--dc);transition:background .2s,color .2s}
.qcard.done .qno{background:var(--dc);color:var(--surface)}
.qtext{font-weight:500;padding-top:3px}
.meter{display:grid;grid-template-columns:58px 1fr;gap:14px;align-items:end}
.face{width:58px;height:58px}
.face circle.head{fill:color-mix(in srgb,var(--dc) 14%,var(--surface));stroke:var(--dc);stroke-width:2}
.face circle.eye{fill:var(--dc)}
.face path{fill:none;stroke:var(--dc);stroke-width:2.6;stroke-linecap:round}
.qcard:not(.done) .face{opacity:.45}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end;height:74px}
.bar{border:0;border-radius:10px 10px 6px 6px;background:var(--track);color:var(--muted);display:flex;align-items:flex-end;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums;padding:0 0 4px;transition:background .15s,color .15s,transform .15s}
.bar:nth-child(1){height:34%} .bar:nth-child(2){height:50%} .bar:nth-child(3){height:66%} .bar:nth-child(4){height:83%} .bar:nth-child(5){height:100%}
.bar.fill{background:color-mix(in srgb,var(--dc) calc(var(--k) * 1%),var(--track));color:var(--surface)}
.bar.peek{background:color-mix(in srgb,var(--dc) 30%,var(--track));color:var(--ink)}
.bar.sel{transform:translateY(-3px)}
.meter-foot{display:grid;grid-template-columns:58px 1fr;gap:14px;margin-top:-6px}
.scale-ends{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted)}
.verdict{font-weight:600;color:var(--dc);min-height:1.5em;font-size:.95rem}
.verdict.empty{color:var(--muted);font-weight:400}

/* ---------- ตัวเลือกแบบปุ่ม ---------- */
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill-btn{border-radius:999px;padding:7px 18px}
.pill-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.field.missing .pills,.field.missing input{outline:2px solid var(--bad);outline-offset:3px;border-radius:12px}
.flabel{font-weight:600;margin-bottom:10px;display:flex;gap:8px;align-items:baseline}
.flabel small{font-weight:400;color:var(--muted);font-size:.84rem}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{position:relative;display:grid;justify-items:center;gap:6px;padding:16px 8px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font-weight:500;transition:border-color .15s,background .15s,transform .1s}
.opt svg{width:30px;height:30px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}
.opt:hover{border-color:color-mix(in srgb,var(--d4) 50%,var(--line))}
.opt:active{transform:scale(.97)}
.opt[aria-pressed="true"]{border-color:var(--d4);background:color-mix(in srgb,var(--d4) 10%,var(--surface));font-weight:700}
.opt[aria-pressed="true"] svg{stroke:var(--d4)}
.opt .tick{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--d4);display:none;place-items:center}
.opt .tick svg{width:12px;height:12px;stroke:var(--surface);stroke-width:3}
.opt[aria-pressed="true"] .tick{display:grid}
.field.missing .opts{outline:2px solid var(--bad);outline-offset:4px;border-radius:14px}
.ticket{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;background:color-mix(in srgb,var(--d4) 8%,var(--surface));border:1.5px dashed color-mix(in srgb,var(--d4) 45%,var(--line))}
.ticket svg{width:28px;height:28px;stroke:var(--d4);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ticket b{font-family:var(--display);font-size:1.25rem;color:var(--d4)}
.ticket span{display:block;font-size:.82rem;color:var(--muted)}
.btn-go,.btn-back{display:inline-flex;align-items:center;gap:8px;border-radius:999px;font-weight:600}
.btn-go{background:var(--accent);color:var(--accent-ink);border:0;padding:12px 22px 12px 26px;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 80%,transparent);transition:transform .12s,box-shadow .12s}
.btn-go:hover{transform:translateY(-1px);box-shadow:0 10px 20px -10px color-mix(in srgb,var(--accent) 90%,transparent)}
.btn-go:active{transform:translateY(0)}
.btn-go svg,.btn-back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn-go.wide{width:100%;justify-content:center;padding:15px;font-size:1.08rem}
.btn-back{background:transparent;border:0;color:var(--muted);padding:12px 8px}
.btn-back:hover{color:var(--ink)}

/* ---------- แถบปุ่มล่าง ---------- */
.navbar{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:6px}
.navbar .row{justify-content:space-between}
.navbar .msg{font-size:.88rem;color:var(--bad)}
.thanks{text-align:center;display:grid;gap:12px;justify-items:center;padding-block:48px}

/* ---------- หน้าเข้าสู่ระบบ ---------- */
.wrap.login-wrap{max-width:1040px;padding-block:5vh 40px}
.login{display:grid;grid-template-columns:1.15fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 30px 60px -40px color-mix(in srgb,var(--accent) 60%,transparent)}
.login-art{position:relative;background:var(--accent);color:#fff;padding:40px 40px 36px;display:grid;gap:26px;align-content:start;overflow:hidden;isolation:isolate}
.login-art::before{content:"";position:absolute;inset:0;z-index:-1;background:
  radial-gradient(circle at 110% -10%,color-mix(in srgb,#fff 22%,transparent) 0 30%,transparent 31%),
  radial-gradient(circle at -20% 120%,color-mix(in srgb,#000 18%,transparent) 0 40%,transparent 41%)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.95rem;opacity:.95}
.brand-mark{display:flex;align-items:flex-end;gap:3px;height:22px;padding:4px 5px;border-radius:7px;background:color-mix(in srgb,#fff 18%,transparent)}
.brand-mark i{width:4px;border-radius:2px;background:#fff}
.brand-mark i:nth-child(1){height:30%}.brand-mark i:nth-child(2){height:55%}.brand-mark i:nth-child(3){height:80%}.brand-mark i:nth-child(4){height:100%}
.login-art h1{color:#fff;font-size:clamp(1.6rem,3.2vw,2.25rem);line-height:1.3}
.login-art h1 span{display:block;opacity:.75;font-weight:500;font-size:.62em;margin-top:6px}
.demo-card{background:color-mix(in srgb,#fff 12%,transparent);border:1px solid color-mix(in srgb,#fff 25%,transparent);border-radius:18px;padding:16px 18px;display:grid;grid-template-columns:52px 1fr;gap:16px;align-items:end;backdrop-filter:blur(4px)}
.demo-card .face{width:52px;height:52px}
.demo-card .face circle.head{fill:color-mix(in srgb,#fff 18%,transparent);stroke:#fff}
.demo-card .face circle.eye{fill:#fff}.demo-card .face path{stroke:#fff}
.demo-bars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end;height:64px}
.demo-bars i{border-radius:8px 8px 5px 5px;background:color-mix(in srgb,#fff 22%,transparent);animation:rise 2.4s ease-in-out infinite}
.demo-bars i:nth-child(1){height:34%;animation-delay:0s}.demo-bars i:nth-child(2){height:50%;animation-delay:.12s}.demo-bars i:nth-child(3){height:66%;animation-delay:.24s}
.demo-bars i:nth-child(4){height:83%;background:#fff;animation-delay:.36s}.demo-bars i:nth-child(5){height:100%;animation-delay:.48s}
.demo-bars i:nth-child(-n+3){background:color-mix(in srgb,#fff 70%,transparent)}
@keyframes rise{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.86)}}
.demo-bars i{transform-origin:bottom}
.feat{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.feat li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;font-size:.95rem}
.feat li svg{width:34px;height:34px;padding:7px;border-radius:10px;background:color-mix(in srgb,#fff 16%,transparent);stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.feat li b{display:block;font-weight:600}
.feat li span{opacity:.8;font-size:.86rem}
.login-form{padding:48px 44px;display:grid;gap:18px;align-content:center}
.login-form h2{font-size:1.7rem}
.btn-google{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:1.02rem;transition:border-color .15s,box-shadow .15s,transform .1s}
.btn-google:hover{border-color:var(--accent);box-shadow:0 8px 20px -12px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn-google:active{transform:scale(.99)}
.btn-google svg{width:22px;height:22px}
.btn-google:disabled{opacity:.6}
.lock-note{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;color:var(--muted);padding:12px 14px;border-radius:12px;background:var(--bg)}
.lock-note svg{width:18px;height:18px;flex:none;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.err-box{border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line));background:color-mix(in srgb,var(--bad) 7%,var(--surface));color:var(--bad);border-radius:12px;padding:10px 14px;font-size:.9rem}
.err-box b{display:block}
.login-foot{font-size:.8rem;color:var(--muted);text-align:center}
@media (max-width:760px){
  .login{grid-template-columns:1fr;border-radius:22px}
  .login-art{padding:28px 24px;gap:20px}
  .feat{display:none}
  .login-form{padding:28px 24px 32px}
}
@media (prefers-reduced-motion:reduce){.demo-bars i{animation:none}}

/* ---------- แถบบนหน้าผู้ดูแล ---------- */
.topbar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:14px 18px;border-radius:18px;background:var(--accent);color:#fff}
.topbar .brand{opacity:1}
.topbar h1{color:#fff;font-size:1.15rem}
.topbar .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.topbar .chip{background:color-mix(in srgb,#fff 15%,transparent);border-color:color-mix(in srgb,#fff 30%,transparent);color:#fff}
.topbar button{background:color-mix(in srgb,#fff 14%,transparent);border-color:color-mix(in srgb,#fff 30%,transparent);color:#fff;border-radius:999px;padding:6px 14px}
.topbar button:hover{background:color-mix(in srgb,#fff 24%,transparent)}

/* ---------- หน้าผู้ดูแล ---------- */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:8px 14px;color:var(--muted);font-weight:600}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{border-left:3px solid var(--accent);padding:2px 12px}
.stat b{display:block;font-size:1.4rem;font-family:var(--display);font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
table.report{border-collapse:collapse;width:100%;min-width:520px;font-size:.95rem;font-variant-numeric:tabular-nums}
table.report caption{text-align:left;caption-side:top;padding-bottom:6px}
table.report th,table.report td{border:1px solid var(--line);padding:6px 10px;vertical-align:middle}
table.report thead th{background:var(--th);text-align:center;font-weight:700}
table.report td.num{text-align:center;white-space:nowrap}
table.report tr.dimrow td{font-weight:700;background:var(--dimrow)}
table.report tr.sum td,table.report tr.total td{font-weight:700;background:var(--sumrow)}
.verdict-pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:.85rem;font-weight:600;border:1px solid currentColor}
.pass{color:var(--good)} .fail{color:var(--bad)}
.links{display:grid}
.link-row{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.link-row code{font-family:var(--body);font-size:.84rem;word-break:break-all;color:var(--muted)}
@media (max-width:560px){.link-row{grid-template-columns:1fr auto}.link-row code{grid-column:1/-1;grid-row:2}}
.comments{display:grid;gap:14px}
.comments ul{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}
.raw{font-size:.86rem;border-collapse:collapse}
.raw td,.raw th{padding:4px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

/* ================= สถิติ ================= */
const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
const f2 = x => (x === undefined || isNaN(x)) ? "-" : r2(x).toFixed(2);
const avg = a => a.reduce((s,x) => s + x, 0) / a.length;
function stats(v){
  const k = v.length; if(!k) return {n:0, mean:NaN, sd:NaN};
  const m = avg(v);
  return {n:k, mean:m, sd: k > 1 ? Math.sqrt(v.reduce((a,b) => a + (b-m)**2, 0) / (k-1)) : 0}; // S.D. แบบกลุ่มตัวอย่าง (n−1)
}
function level(m){
  if(isNaN(m)) return "-";
  const x = r2(m);
  return x >= 4.51 ? "มากที่สุด" : x >= 3.51 ? "มาก" : x >= 2.51 ? "ปานกลาง" : x >= 1.51 ? "น้อย" : "น้อยที่สุด";
}
function compute(rows){
  return {
    n: rows.length,
    items: Array.from({length:NQ}, (_,i) => stats(rows.map(r => r.scores[i]))),
    dims: DIMS.map(d => stats(rows.map(r => avg(d.idx.map(i => r.scores[i]))))),
    total: stats(rows.map(r => avg(r.scores)))
  };
}
function narrative(res, who, mediaName){

  const pass = r2(res.total.mean) >= CONFIG.PASS_MEAN;
  return `ผลการประเมินความพึงพอใจของ${who}ที่มีต่อ${mediaName} จำนวน ${res.n} คน พบว่า มีความพึงพอใจโดยรวมอยู่ในระดับ${level(res.total.mean)} (x̄ = ${f2(res.total.mean)}, S.D. = ${f2(res.total.sd)}) `
   + `เมื่อพิจารณาเป็นรายด้าน เรียงจากมากไปน้อย ได้แก่ ${ds.map(({s,i}) => `${DIMS[i].name} อยู่ในระดับ${level(s.mean)} (x̄ = ${f2(s.mean)}, S.D. = ${f2(s.sd)})`).join(" ")} `

           : `ค่าเฉลี่ยโดยรวมต่ำกว่า ${CONFIG.PASS_MEAN.toFixed(2)} จึงยังไม่ผ่านเกณฑ์คุณภาพที่กำหนด`);
}

}

}

async function initStore(){
  if(DEMO){
    const emit = () => store._cb && store._cb(memRows.slice());
    const mk = d => ({...d, id: Math.random().toString(36).slice(2), createdAt: Date.now()});
    store.add = async d => { memRows.push(mk(d)); lsSet(LSKEY, memRows); emit(); };
    store.addMany = async arr => { arr.forEach(d => memRows.push(mk(d))); lsSet(LSKEY, memRows); emit(); };
    store.watch = cb => { store._cb = cb; emit(); return () => { store._cb = null; }; };
    store.remove = async id => { memRows = memRows.filter(r => r.id !== id); lsSet(LSKEY, memRows); emit(); };
    store.clear = async () => { memRows = []; lsSet(LSKEY, memRows); emit(); };
    store.signIn = async () => {}; store.signOut = async () => {};
    store.onAuth = cb => cb({email:"โหมดทดลอง", demo:true});
    return;
  }
  const V = "10.12.2";
  const [{initializeApp}, fs, au] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`)
  ]);
  const fapp = initializeApp(fb), db = fs.getFirestore(fapp), auth = au.getAuth(fapp);
  const col = fs.collection(db, CONFIG.COLLECTION);
  store.add = d => fs.addDoc(col, {...d, createdAt: fs.serverTimestamp()});
  store.watch = (cb, err) => fs.onSnapshot(col, s => cb(s.docs.map(x => { const v = x.data(); return {...v, id:x.id, createdAt: v.createdAt?.toMillis?.() || 0}; })), err);
  store.remove = id => fs.deleteDoc(fs.doc(db, CONFIG.COLLECTION, id));
  store.signIn = () => au.signInWithPopup(auth, new au.GoogleAuthProvider());
  store.signOut = () => au.signOut(auth);
  store.onAuth = cb => au.onAuthStateChanged(auth, cb);
}

function qCard(qi, d){
  return `<div class="qcard" id="q${qi}" style="--dc:var(${d.color})">
    <div class="qhead"><span class="qno">${qi+1}</span><p class="qtext">${itemText(qi)}</p></div>
    <div class="meter"><span class="facebox">${faceSVG(0)}</span>
      <div class="bars" role="radiogroup" aria-label="ข้อ ${qi+1} ระดับความพึงพอใจ">
        ${[1,2,3,4,5].map(v => `<button type="button" class="bar" role="radio" data-q="${qi}" data-v="${v}" aria-checked="false" aria-label="${v} ${LEVEL_TXT[v]}">${v}</button>`).join("")}
      </div></div>
    <div class="meter-foot"><span></span><div><div class="scale-ends"><span>น้อยที่สุด</span><span>มากที่สุด</span></div><div class="verdict empty" id="vd${qi}"></div></div></div>
  </div>`;
}
function paintQ(qi, peek = 0){
  const card = $("#q" + qi); if(!card) return;
  const v = S.scores[qi], show = peek || v;
  card.classList.toggle("done", !!v);
  if(v) card.classList.remove("missing");
  card.querySelectorAll(".bar").forEach(b => {
    const bv = +b.dataset.v;
    b.classList.toggle("fill", !peek && !!v && bv <= v);
    b.classList.toggle("peek", !!peek && bv <= peek);
    b.classList.toggle("sel", bv === v);
    b.style.setProperty("--k", 45 + bv * 11);
    b.setAttribute("aria-checked", bv === v);
    b.tabIndex = (v ? bv === v : bv === 3) ? 0 : -1;
  });
  card.querySelector(".facebox").innerHTML = faceSVG(show);
  const vd = $("#vd" + qi);
  vd.textContent = show ? `${show} · ${LEVEL_TXT[show]}` : "แตะแท่งเพื่อเลือกระดับความพึงพอใจ";
  vd.classList.toggle("empty", !show);
}
function renderDim(di){
  const d = DIMS[di];
  app.innerHTML = `${stepper()}
    <div class="dimhead" style="--dc:var(${d.color})"><span class="num">${di+2}</span><h2>${d.name}</h2><p>${d.items.length} ข้อ · แตะแท่งระดับ 1 (น้อยที่สุด) ถึง 5 (มากที่สุด)</p></div>
    ${d.idx.map(qi => qCard(qi, d)).join("")}
    ${navbar(di === DIMS.length - 1 ? "ถัดไป: ความคิดเห็น" : "ถัดไป")}`;
  d.idx.forEach(qi => paintQ(qi));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const choose = (qi, v) => {
    const first = !S.scores[qi];
    S.scores[qi] = v; paintQ(qi);
    if(first){
      const nxt = d.idx.find(i => !S.scores[i]);
      if(nxt !== undefined) setTimeout(() => $("#q" + nxt)?.scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"center"}), 280);
    }
  };
  app.querySelectorAll(".bar").forEach(b => {
    const qi = +b.dataset.q, v = +b.dataset.v;
    b.onclick = () => choose(qi, v);
    b.onkeydown = e => {
      const dir = {ArrowRight:1, ArrowUp:1, ArrowLeft:-1, ArrowDown:-1}[e.key];
      if(!dir) return; e.preventDefault();
      const nv = Math.min(5, Math.max(1, (S.scores[qi] || 3) + (S.scores[qi] ? dir : 0)));
      S.scores[qi] = nv; paintQ(qi);
      $(`#q${qi} .bar[data-v="${nv}"]`).focus();
    };
  });
  $("#back").onclick = () => go(di + 1);
  $("#next").onclick = () => {
    const miss = d.idx.filter(i => !S.scores[i]);
    if(miss.length){
      miss.forEach(i => $("#q" + i).classList.add("missing"));
      showMsg(`ยังไม่ได้ตอบข้อ ${miss.map(i => i+1).join(", ")}`);
      $("#q" + miss[0]).scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"center"});
      return;
    }
    go(di + 3);
  };
}

function htmlItems(res, cap){

  const block = (title, arr) => `<tr class="dimrow"><td colspan="3">${title}</td></tr>` + arr.map(([k,v]) => `<tr><td>${esc(k)}</td><td class="num">${v}</td><td class="num">${pct(v)}</td></tr>`).join("");
  return `<table class="report"><caption><b>ตาราง</b> ข้อมูลทั่วไปของผู้ตอบแบบประเมิน (n = ${n})</caption><thead><tr><th>ข้อมูลทั่วไป</th><th style="width:100px">จำนวน (คน)</th><th style="width:90px">ร้อยละ</th></tr></thead><tbody>
    ${block("เพศ", freq(rows, "gender", GENDERS))}${withRoom ? block("ชั้น/ห้อง", freq(rows, "room").sort((a,b) => thSort(a[0], b[0]))) : ""}${block("อุปกรณ์ที่ใช้เรียน", freq(rows, "device", DEVICES))}
    <tr class="total"><td>รวม</td><td class="num">${n}</td><td class="num">100.00</td></tr></tbody></table>`;
}

  panel.innerHTML = `
    <div class="card grid2">

    </div>

      <div><h2>ไฟล์รายงานผล</h2><p class="muted small">ไฟล์ Word มีผลภาพรวมทุกห้อง ตารางเปรียบเทียบรายห้อง ผลแยกรายห้องครบทุกห้อง และความคิดเห็นปลายเปิด</p></div>
      <div class="row"><button class="primary" id="docx">ดาวน์โหลดรายงาน (Word)</button><button id="csv">ข้อมูลดิบ (CSV)</button></div>

      <div class="tbl-wrap">${htmlItems(res, `<b>ตาราง</b> ค่าเฉลี่ย ส่วนเบี่ยงเบนมาตรฐาน และระดับความพึงพอใจ จำแนกรายข้อ (n = ${res.n})`)}</div>

      <div class="tbl-wrap">${htmlInfo(rows, A.room === "__all")}</div>
      <details><summary class="small muted">เกณฑ์การแปลผลและวิธีคำนวณ</summary><div class="small muted" style="margin-top:6px;display:grid;gap:4px">
        <p>เกณฑ์การแปลผล (${esc(CONFIG.SOURCE)}): 4.51–5.00 มากที่สุด · 3.51–4.50 มาก · 2.51–3.50 ปานกลาง · 1.51–2.50 น้อย · 1.00–1.50 น้อยที่สุด</p>
        <p>S.D. แบบกลุ่มตัวอย่าง (n − 1) · ค่ารายด้านและรวมทุกด้านคำนวณจากค่าเฉลี่ยของผู้ตอบแต่ละคน · แปลผลจากค่าเฉลี่ยทศนิยม 2 ตำแหน่ง</p></div></details>

      ${[["จุดเด่นของสื่อ","strengths",S_],["สิ่งที่ควรปรับปรุง","improve",I_]].map(([t,k,list]) => { const g = groupComments(list, k);
        return `<div><h3>${t} (${list.length})</h3>${g.length ? `<ul>${g.map(x => `<li>${esc(x.t)}${x.n > 1 ? ` <b>(${x.n} คน)</b>` : ""} <span class="muted small">— ${esc([...x.rooms].sort(thSort).join(", "))}</span></li>`).join("")}</ul>` : `<p class="muted small">ยังไม่มีความคิดเห็น</p>`}</div>`; }).join("")}

    <details class="card"><summary><b>ข้อมูลดิบรายคน (${rows.length})</b></summary>
      <div class="tbl-wrap" style="margin-top:10px"><table class="raw"><thead><tr><th>#</th><th>ห้อง</th><th>เพศ</th><th>อุปกรณ์</th>${Array.from({length:NQ}, (_,i) => `<th>${i+1}</th>`).join("")}<th></th></tr></thead>
      <tbody>${rows.map((r,k) => `<tr><td>${k+1}</td><td>${esc(r.room||"-")}</td><td>${esc(r.gender||"-")}</td><td>${esc(r.device||"-")}</td>${r.scores.map(s => `<td>${s}</td>`).join("")}<td><button class="small" data-del="${esc(r.id)}">ลบ</button></td></tr>`).join("")}</tbody></table></div>
      <p class="small muted" style="margin-top:6px">กด “ลบ” แล้วกด “ยืนยันลบ” เพื่อลบคำตอบที่ส่งซ้ำหรือไม่ถูกต้อง</p></details>`;

  $("#msel").onchange = e => { A.media = e.target.value; A.room = "__all"; renderResults(); };
  $("#rsel").onchange = e => { A.room = e.target.value; renderResults(); };
  $("#cpsum").onclick = () => copyText(narrative(res, who, mname));
  $("#docx").onclick = async () => {
    const b = $("#docx"); b.disabled = true; b.textContent = "กำลังสร้างไฟล์…";
    try { await saveFile(`รายงานผลความพึงพอใจ_${safeName(mname)}.docx`, buildReport(mname, mrows)); }
    catch(e){ toast("สร้างไฟล์ไม่สำเร็จ: " + (e.message || e)); }
    b.disabled = false; b.textContent = "ดาวน์โหลดรายงาน (Word)";
  };
  $("#csv").onclick = () => saveFile(`ข้อมูลดิบ_${safeName(mname)}.csv`, buildCSV(mrows));
  panel.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if(b.dataset.arm !== "1"){ b.dataset.arm = "1"; b.textContent = "ยืนยันลบ"; b.style.color = "var(--bad)"; return; }
    b.disabled = true;
    try { await store.remove(b.dataset.del); toast("ลบแล้ว"); } catch(e){ toast("ลบไม่สำเร็จ: " + (e.code || e.message)); b.disabled = false; }
  });
}
const safeName = s => s.replace(/[\\/:*?"<>|]/g, "_").slice(0, 60);
function buildCSV(rows){
  const head = ["ลำดับ","วันที่ส่ง","ห้อง","เพศ","อุปกรณ์", ...Array.from({length:NQ}, (_,i) => "ข้อ" + (i+1)), "จุดเด่นของสื่อ", "สิ่งที่ควรปรับปรุง"];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const d = t => t ? new Date(t).toLocaleString("th-TH") : "";
  const body = rows.map((r,k) => [k+1, d(r.createdAt), r.room, r.gender, r.device, ...r.scores, r.strengths, r.improve]);
  return new Blob(["﻿" + [head, ...body].map(r => r.map(q).join(",")).join("\r\n")], {type:"text/csv;charset=utf-8"});
}

/* ================= สร้างไฟล์ Word (.docx) ================= */
const FONT = "TH SarabunPSK";
const X = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const run = (t, o = {}) => `<w:r><w:rPr><w:rFonts w:ascii="${FONT}" w:hAnsi="${FONT}" w:cs="${FONT}" w:eastAsia="${FONT}"/>${o.b ? "<w:b/><w:bCs/>" : ""}<w:sz w:val="${o.sz || 32}"/><w:szCs w:val="${o.sz || 32}"/></w:rPr><w:t xml:space="preserve">${X(t)}</w:t></w:r>`;
const para = (runs, o = {}) => `<w:p><w:pPr>${o.keep ? "<w:keepNext/>" : ""}<w:spacing w:before="${o.before || 0}" w:after="${o.after || 0}" w:line="240" w:lineRule="auto"/>${o.ind ? `<w:ind w:firstLine="${o.ind}"/>` : ""}${o.hang ? `<w:ind w:left="${o.hang}" w:hanging="300"/>` : ""}${o.align ? `<w:jc w:val="${o.align}"/>` : ""}</w:pPr>${Array.isArray(runs) ? runs.join("") : run(runs, o)}</w:p>`;
const pageBreak = `<w:p><w:r><w:br w:type="page"/></w:r></w:p>`;
const FILL = {th:"DBE5F1", dim:"F2F2F2", sum:"FBF6E3"};
function wtable(widths, rows){
  const total = widths.reduce((a,b) => a + b, 0);
  const border = ["top","left","bottom","right","insideH","insideV"].map(k => `<w:${k} w:val="single" w:sz="4" w:space="0" w:color="7F7F7F"/>`).join("");
  const trs = rows.map(r => {
    let col = 0;
    const tcs = r.cells.map(c => {
      const span = c.span || 1, w = widths.slice(col, col + span).reduce((a,b) => a + b, 0); col += span;
      const fill = c.fill || r.fill;
      return `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${span > 1 ? `<w:gridSpan w:val="${span}"/>` : ""}${fill ? `<w:shd w:val="clear" w:color="auto" w:fill="${fill}"/>` : ""}<w:vAlign w:val="center"/></w:tcPr>${para([run(c.t, {b: c.b || r.b})], {align: c.align})}</w:tc>`;
    }).join("");
    return `<w:tr><w:trPr><w:cantSplit/>${r.header ? "<w:tblHeader/>" : ""}</w:trPr>${tcs}</w:tr>`;
  }).join("");
  return `<w:tbl><w:tblPr><w:tblW w:w="${total}" w:type="dxa"/><w:jc w:val="center"/><w:tblBorders>${border}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="100" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${widths.map(w => `<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid>${trs}</w:tbl>` + para("", {after: 120});
}
const C = (t, o = {}) => ({t, ...o});
const N = t => ({t, align:"center"});
const HEAD = cols => ({header:true, b:true, fill:FILL.th, cells: cols.map(t => N(t))});

function buildReport(mediaName, rows){
  let tno = 0;
  const cap = text => para([run(`ตารางที่ ${++tno} `, {b:true}), run(text)], {keep:true, after:60, before:120});
  const H1 = t => para(t, {b:true, sz:36, before:240, after:120, keep:true});
  const H2 = t => para(t, {b:true, before:180, after:60, keep:true});
  const W4 = [4706, 1100, 1100, 1400];
  const dimTable = res => wtable(W4, [HEAD(["ด้าน","x̄","S.D.","ระดับ"]),
    ...DIMS.map((d,i) => ({cells:[C(d.name), N(f2(res.dims[i].mean)), N(f2(res.dims[i].sd)), N(level(res.dims[i].mean))]})),
    {b:true, fill:FILL.sum, cells:[C("รวมทุกด้าน"), N(f2(res.total.mean)), N(f2(res.total.sd)), N(level(res.total.mean))]}]);
  const itemTable = res => {
    const R = [HEAD(["รายการประเมิน","x̄","S.D.","ระดับ"])];
    DIMS.forEach((d,di) => {
      R.push({b:true, fill:FILL.dim, cells:[C(d.name, {span:4})]});
      d.idx.forEach(qi => R.push({cells:[C(`${qi+1}. ${itemText(qi)}`), N(f2(res.items[qi].mean)), N(f2(res.items[qi].sd)), N(level(res.items[qi].mean))]}));
      R.push({b:true, fill:FILL.sum, cells:[C(`รวม${d.name}`), N(f2(res.dims[di].mean)), N(f2(res.dims[di].sd)), N(level(res.dims[di].mean))]});
    });
    R.push({b:true, fill:FILL.sum, cells:[C("รวมทุกด้าน"), N(f2(res.total.mean)), N(f2(res.total.sd)), N(level(res.total.mean))]});
    return wtable(W4, R);
  };
  const infoTable = (rs, withRoom) => {
    const n = rs.length, pct = v => (v / n * 100).toFixed(2);
    const R = [HEAD(["ข้อมูลทั่วไป","จำนวน (คน)","ร้อยละ"])];
    const block = (t, arr) => { R.push({b:true, fill:FILL.dim, cells:[C(t, {span:3})]}); arr.forEach(([k,v]) => R.push({cells:[C("    " + k), N(String(v)), N(pct(v))]})); };
    block("เพศ", freq(rs, "gender", GENDERS));
    if(withRoom) block("ชั้น/ห้อง", freq(rs, "room").sort((a,b) => thSort(a[0], b[0])));
    block("อุปกรณ์ที่ใช้เรียน", freq(rs, "device", DEVICES));
    R.push({b:true, fill:FILL.sum, cells:[C("รวม"), N(String(n)), N("100.00")]});
    return wtable([4706, 1800, 1800], R);
  };
  const comments = rs => {
    let x = H2("ความคิดเห็นจากคำถามปลายเปิด");
    [["จุดเด่นของสื่อ","strengths"],["สิ่งที่ควรปรับปรุง","improve"]].forEach(([t,k]) => {
      const total = rs.filter(r => (r[k] || "").trim()).length, g = groupComments(rs, k);
      x += para([run(t, {b:true}), run(` (${total} ความคิดเห็น)`)], {keep:true, before:60});
      x += g.length ? g.map(c => para("– " + c.t + (c.n > 1 ? ` (${c.n} คน)` : ""), {hang: 600})).join("") : para("– ไม่มีความคิดเห็น", {hang: 600});
    });
    return x;
  };
  const section = (rs, who, withRoom) => {
    const res = compute(rs);
    let x = cap(`ข้อมูลทั่วไปของผู้ตอบแบบประเมิน (n = ${res.n})`) + infoTable(rs, withRoom);
    x += cap(`ค่าเฉลี่ย ส่วนเบี่ยงเบนมาตรฐาน และระดับความพึงพอใจของ${who}ที่มีต่อสื่อ จำแนกรายด้าน (n = ${res.n})`) + dimTable(res);
    const t1 = tno;
    x += cap(`ค่าเฉลี่ย ส่วนเบี่ยงเบนมาตรฐาน และระดับความพึงพอใจของ${who}ที่มีต่อสื่อ จำแนกรายข้อ (n = ${res.n})`) + itemTable(res);
    x += para(`จากตารางที่ ${t1} และตารางที่ ${tno} ` + narrative(res, who, mediaName), {ind:720, after:120, before:60});
    return x + comments(rs);
  };
  const rooms = [...new Set(rows.map(roomOf))].sort(thSort);
  const today = new Date().toLocaleDateString("th-TH", {year:"numeric", month:"long", day:"numeric"});
  let body = "";
  body += para("รายงานผลการประเมินความพึงพอใจของผู้เรียนที่มีต่อสื่อ", {b:true, sz:40, align:"center", after:60});
  body += para(mediaName, {b:true, sz:36, align:"center", after:240});
  body += para([run("จำนวนผู้ตอบแบบประเมิน ", {b:true}), run(`${rows.length} คน จาก ${rooms.length} ห้อง (${rooms.join(", ")})`)]);
  body += para([run("วันที่ออกรายงาน ", {b:true}), run(today)], {after:120});
  body += H2("เกณฑ์การแปลผล");
  body += cap(`เกณฑ์การแปลผลค่าเฉลี่ยความพึงพอใจ (${CONFIG.SOURCE})`);
  body += wtable([1800, 2800, 3706], [HEAD(["ระดับคะแนน","ค่าเฉลี่ย","การแปลผล"]),
    ...[[5,"4.51 – 5.00","พึงพอใจมากที่สุด"],[4,"3.51 – 4.50","พึงพอใจมาก"],[3,"2.51 – 3.50","พึงพอใจปานกลาง"],[2,"1.51 – 2.50","พึงพอใจน้อย"],[1,"1.00 – 1.50","พึงพอใจน้อยที่สุด"]]
      .map(([a,b,c]) => ({cells:[N(String(a)), N(b), C(c)]}))]);
  body += para(`สื่อถือว่ามีคุณภาพเป็นที่ยอมรับเมื่อค่าเฉลี่ยความพึงพอใจโดยรวมอยู่ในระดับมากขึ้นไป (${CONFIG.PASS_MEAN.toFixed(2)} ขึ้นไป)`, {ind:720, after:120});

  body += H1("ส่วนที่ 1 ผลการประเมินภาพรวมทุกห้อง");
  body += section(rows, "ผู้เรียน", true);
  if(rooms.length > 1){
    body += H2("เปรียบเทียบผลการประเมินรายห้อง");
    body += cap("ค่าเฉลี่ยความพึงพอใจ จำแนกตามห้องเรียนและรายด้าน");
    const R = [{header:true, b:true, fill:FILL.th, cells:[N("ห้อง"), N("n"), ...DIMS.map(d => N(d.short)), N("รวม x̄ (S.D.)"), N("ระดับ")]}];
    rooms.forEach(rm => { const res = compute(rows.filter(r => roomOf(r) === rm));
      R.push({cells:[N(rm), N(String(res.n)), ...res.dims.map(s => N(f2(s.mean))), N(`${f2(res.total.mean)} (${f2(res.total.sd)})`), N(level(res.total.mean))]}); });
    const all = compute(rows);
    R.push({b:true, fill:FILL.sum, cells:[N("รวม"), N(String(all.n)), ...all.dims.map(s => N(f2(s.mean))), N(`${f2(all.total.mean)} (${f2(all.total.sd)})`), N(level(all.total.mean))]});
    body += wtable([1150, 650, 1250, 1250, 1250, 1556, 1200], R);
  }
  body += pageBreak + H1("ส่วนที่ 2 ผลการประเมินแยกรายห้อง");
  rooms.forEach((rm, i) => {
    if(i) body += pageBreak;
    const rs = rows.filter(r => roomOf(r) === rm);
    body += para(`ห้อง ${rm} (จำนวน ${rs.length} คน)`, {b:true, sz:34, before:120, after:60, keep:true});
    body += section(rs, `ผู้เรียนห้อง ${rm} `, false);
  });
  body += `<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="2160" w:right="1440" w:bottom="1440" w:left="2160" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr>`;

  const W = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"';
  const files = {
    "[Content_Types].xml": `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`,
    "_rels/.rels": `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`,
    "word/_rels/document.xml.rels": `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`,
    "word/styles.xml": `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles ${W}><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="${FONT}" w:hAnsi="${FONT}" w:cs="${FONT}" w:eastAsia="${FONT}"/><w:sz w:val="32"/><w:szCs w:val="32"/><w:lang w:val="en-US" w:bidi="th-TH"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>`,
    "word/document.xml": `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ${W}><w:body>${body}</w:body></w:document>`
  };
  return zipStore(files, "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
}
/* zip แบบไม่บีบอัด (STORE) สำหรับประกอบไฟล์ .docx โดยไม่ต้องใช้ไลบรารีภายนอก */
const CRC_T = (() => { const t = new Uint32Array(256); for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = u => { let c = 0xFFFFFFFF; for(let i = 0; i < u.length; i++) c = CRC_T[(c ^ u[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function zipStore(files, mime){
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  for(const [name, text] of Object.entries(files)){
    const nb = enc.encode(name), data = enc.encode(text), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, 0, true); h.setUint16(12, 33, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true);
    h.setUint16(26, nb.length, true); h.setUint16(28, 0, true);
    parts.push(h, nb, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, 0, true); c.setUint16(14, 33, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
    c.setUint16(28, nb.length, true); c.setUint32(42, off, true);
    central.push(c, nb);
    off += 30 + nb.length + data.length;
  }
  const csize = central.reduce((s,x) => s + x.byteLength, 0), n = Object.keys(files).length;
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, n, true); e.setUint16(10, n, true); e.setUint32(12, csize, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, e], {type: mime});
}
