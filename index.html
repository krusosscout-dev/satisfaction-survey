<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>คลังแบบประเมินออนไลน์</title>
<!--
  ระบบแบบประเมินและแบบสอบถามออนไลน์ (ไฟล์เดียว สำหรับ Vercel + Firebase)
  หน้าผู้ดูแล: เปิดที่อยู่เว็บโดยตรง หรือ /admin
  ลิงก์ผู้ตอบ: ?s=รหัสแบบสอบถาม&g=กลุ่ม (สร้างจากหน้าผู้ดูแล)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap">
<style>
/* Layout: ขั้นตอนทีละหน้า (หน้าแรก → ข้อมูล → 3 ด้าน → ความคิดเห็น) คอลัมน์เดียว / หน้าผู้ดูแลเป็นรายงานแบบเอกสาร */
:root{
  --bg:#f2f4f5; --surface:#ffffff; --ink:#18242b; --muted:#5b6b74; --line:#d5dde1; --track:#e8edf0;
  --accent:#0f6e78; --accent-ink:#ffffff;
  --d1:#0f766e; --d2:#4053c9; --d3:#c05a0c; --d4:#7a4fa3;
  --th:#dbe5f1; --dimrow:#f2f2f2; --sumrow:#fbf6e3;
  --good:#2e7d4f; --bad:#b3362f; --warn:#a46200;
  --c1:#008a7c; --c2:#4053c9; --c3:#c05a0c; --c4:#9b3fa8; --c5:#5f7f12; --c6:#c2185b; --cT:#3d4b55; --grid:#e3e8eb;
  --display:"Anuphan","Leelawadee UI","Tahoma",system-ui,sans-serif;
  --body:"Anuphan","Leelawadee UI","Tahoma",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10171b; --surface:#172228; --ink:#e4ebef; --muted:#9caab2; --line:#2b3941; --track:#24323a;
  --accent:#52b6bf; --accent-ink:#0b1a1d;
  --d1:#3cbfb2; --d2:#8b9bff; --d3:#f09a52; --d4:#b993dc;
  --th:#1f2f40; --dimrow:#1d2a31; --sumrow:#2c2a1d;
  --good:#6cc28f; --bad:#ec7d75; --warn:#e3a54a;
  --c1:#2a9f94; --c2:#7a88ec; --c3:#d07d39; --c4:#a86ab8; --c5:#76963a; --c6:#e0608c; --cT:#9aa8b1; --grid:#26343c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10171b; --surface:#172228; --ink:#e4ebef; --muted:#9caab2; --line:#2b3941; --track:#24323a;
  --accent:#52b6bf; --accent-ink:#0b1a1d;
  --d1:#3cbfb2; --d2:#8b9bff; --d3:#f09a52; --d4:#b993dc;
  --th:#1f2f40; --dimrow:#1d2a31; --sumrow:#2c2a1d;
  --good:#6cc28f; --bad:#ec7d75; --warn:#e3a54a;
  --c1:#2a9f94; --c2:#7a88ec; --c3:#d07d39; --c4:#a86ab8; --c5:#76963a; --c6:#e0608c; --cT:#9aa8b1; --grid:#26343c; color-scheme:dark}

*{box-sizing:border-box}
button,input,select,textarea,code{font-family:var(--body)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.65 var(--body);padding:0 16px}
.wrap{max-width:760px;margin:0 auto;padding-block:24px 40px;display:grid;gap:18px}
.wrap.wide{max-width:980px}
h1,h2,h3{font-family:var(--display);line-height:1.35;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:1.65rem} h2{font-size:1.2rem} h3{font-size:1.02rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.88rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.banner{border:1px dashed var(--warn);color:var(--warn);border-radius:10px;padding:8px 14px;font-size:.9rem}
.eyebrow{font-size:.8rem;letter-spacing:.05em;color:var(--accent);font-weight:600}
button,.btn{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;text-decoration:none}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
textarea{resize:vertical}
label.f{display:grid;gap:6px;font-weight:600}
label.f .hint{font-weight:400;color:var(--muted);font-size:.86rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.foot{text-align:center;font-size:.85rem} .foot a{color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;font-size:.92rem;z-index:20}

/* ---------- หน้าแรก ---------- */
.hero{display:grid;gap:14px;padding-block:18px 4px}
.media-name{font-family:var(--display);font-weight:700;font-size:clamp(1.4rem,4.5vw,1.9rem);line-height:1.4;text-wrap:balance}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.88rem;background:var(--surface)}
.chip b{font-weight:600}
.plan{display:grid;gap:4px}
.plan-item{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.plan-item:last-child{border-bottom:0}
.plan-dot{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--surface);background:var(--dc)}

/* ---------- ตัวบอกขั้นตอน ---------- */
.stepper{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:grid;gap:6px}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.segs i{height:6px;border-radius:3px;background:var(--track)}
.step-label{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);gap:10px}
.step-label b{color:var(--ink);font-weight:600}

/* ---------- หัวด้าน ---------- */
.dimhead{border-radius:16px;padding:18px 20px;color:var(--surface);background:var(--dc);display:grid;grid-template-columns:auto 1fr;gap:2px 16px;align-items:center}
.dimhead .num{grid-row:span 2;font-family:var(--display);font-size:2.6rem;font-weight:700;line-height:1;opacity:.9}
.dimhead h2{font-size:1.3rem;color:inherit}
.dimhead p{opacity:.92;font-size:.9rem}

/* ---------- การ์ดคำถาม + มาตรวัด ---------- */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:14px;transition:border-color .2s}
.qcard.missing{border-color:var(--bad)}
.qhead{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.qno{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.95rem;border:2px solid var(--dc);color:var(--dc);transition:background .2s,color .2s}
.qcard.done .qno{background:var(--dc);color:var(--surface)}
.qtext{font-weight:500;padding-top:3px}
.meter{display:grid;grid-template-columns:58px 1fr;gap:14px;align-items:end}
.face{width:58px;height:58px}
.face circle.head{fill:color-mix(in srgb,var(--dc) 14%,var(--surface));stroke:var(--dc);stroke-width:2}
.face circle.eye{fill:var(--dc)}
.face path{fill:none;stroke:var(--dc);stroke-width:2.6;stroke-linecap:round}
.qcard:not(.done) .face{opacity:.45}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end;height:74px}
.bar{border:0;border-radius:10px 10px 6px 6px;background:var(--track);color:var(--muted);display:flex;align-items:flex-end;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums;padding:0 0 4px;transition:background .15s,color .15s,transform .15s}
.bar:nth-child(1){height:34%} .bar:nth-child(2){height:50%} .bar:nth-child(3){height:66%} .bar:nth-child(4){height:83%} .bar:nth-child(5){height:100%}
.bar.fill{background:color-mix(in srgb,var(--dc) calc(var(--k) * 1%),var(--track));color:var(--surface)}
.bar.peek{background:color-mix(in srgb,var(--dc) 30%,var(--track));color:var(--ink)}
.bar.sel{transform:translateY(-3px)}
.meter-foot{display:grid;grid-template-columns:58px 1fr;gap:14px;margin-top:-6px}
.scale-ends{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted)}
.verdict{font-weight:600;color:var(--dc);min-height:1.5em;font-size:.95rem}
.verdict.empty{color:var(--muted);font-weight:400}

/* ---------- ตัวเลือกแบบปุ่ม ---------- */
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill-btn{border-radius:999px;padding:7px 18px}
.pill-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.field.missing .pills,.field.missing input{outline:2px solid var(--bad);outline-offset:3px;border-radius:12px}
.flabel{font-weight:600;margin-bottom:10px;display:flex;gap:8px;align-items:baseline}
.flabel small{font-weight:400;color:var(--muted);font-size:.84rem}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{position:relative;display:grid;justify-items:center;gap:6px;padding:16px 8px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font-weight:500;transition:border-color .15s,background .15s,transform .1s}
.opt svg{width:30px;height:30px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}
.opt:hover{border-color:color-mix(in srgb,var(--d4) 50%,var(--line))}
.opt:active{transform:scale(.97)}
.opt[aria-pressed="true"]{border-color:var(--d4);background:color-mix(in srgb,var(--d4) 10%,var(--surface));font-weight:700}
.opt[aria-pressed="true"] svg{stroke:var(--d4)}
.opt .tick{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--d4);display:none;place-items:center}
.opt .tick svg{width:12px;height:12px;stroke:var(--surface);stroke-width:3}
.opt[aria-pressed="true"] .tick{display:grid}
.field.missing .opts{outline:2px solid var(--bad);outline-offset:4px;border-radius:14px}
.ticket{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;background:color-mix(in srgb,var(--d4) 8%,var(--surface));border:1.5px dashed color-mix(in srgb,var(--d4) 45%,var(--line))}
.ticket svg{width:28px;height:28px;stroke:var(--d4);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ticket b{font-family:var(--display);font-size:1.25rem;color:var(--d4)}
.ticket span{display:block;font-size:.82rem;color:var(--muted)}
.btn-go,.btn-back{display:inline-flex;align-items:center;gap:8px;border-radius:999px;font-weight:600}
.btn-go{background:var(--accent);color:var(--accent-ink);border:0;padding:12px 22px 12px 26px;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 80%,transparent);transition:transform .12s,box-shadow .12s}
.btn-go:hover{transform:translateY(-1px);box-shadow:0 10px 20px -10px color-mix(in srgb,var(--accent) 90%,transparent)}
.btn-go:active{transform:translateY(0)}
.btn-go svg,.btn-back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn-go.wide{width:100%;justify-content:center;padding:15px;font-size:1.08rem}
.btn-back{background:transparent;border:0;color:var(--muted);padding:12px 8px}
.btn-back:hover{color:var(--ink)}

/* ---------- แถบปุ่มล่าง ---------- */
.navbar{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:6px}
.navbar .row{justify-content:space-between}
.navbar .msg{font-size:.88rem;color:var(--bad)}
.thanks{text-align:center;display:grid;gap:12px;justify-items:center;padding-block:48px}

/* ---------- หน้าเข้าสู่ระบบ ---------- */
.wrap.login-wrap{max-width:1040px;padding-block:5vh 40px}
.login{display:grid;grid-template-columns:1.15fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 30px 60px -40px color-mix(in srgb,var(--accent) 60%,transparent)}
.login-art{position:relative;background:var(--accent);color:#fff;padding:40px 40px 36px;display:grid;gap:26px;align-content:start;overflow:hidden;isolation:isolate}
.login-art::before{content:"";position:absolute;inset:0;z-index:-1;background:
  radial-gradient(circle at 110% -10%,color-mix(in srgb,#fff 22%,transparent) 0 30%,transparent 31%),
  radial-gradient(circle at -20% 120%,color-mix(in srgb,#000 18%,transparent) 0 40%,transparent 41%)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.95rem;opacity:.95}
.brand-mark{display:flex;align-items:flex-end;gap:3px;height:22px;padding:4px 5px;border-radius:7px;background:color-mix(in srgb,#fff 18%,transparent)}
.brand-mark i{width:4px;border-radius:2px;background:#fff}
.brand-mark i:nth-child(1){height:30%}.brand-mark i:nth-child(2){height:55%}.brand-mark i:nth-child(3){height:80%}.brand-mark i:nth-child(4){height:100%}
.login-art h1{color:#fff;font-size:clamp(1.6rem,3.2vw,2.25rem);line-height:1.3}
.login-art h1 span{display:block;opacity:.75;font-weight:500;font-size:.62em;margin-top:6px}
.demo-card{background:color-mix(in srgb,#fff 12%,transparent);border:1px solid color-mix(in srgb,#fff 25%,transparent);border-radius:18px;padding:16px 18px;display:grid;grid-template-columns:52px 1fr;gap:16px;align-items:end;backdrop-filter:blur(4px)}
.demo-card .face{width:52px;height:52px}
.demo-card .face circle.head{fill:color-mix(in srgb,#fff 18%,transparent);stroke:#fff}
.demo-card .face circle.eye{fill:#fff}.demo-card .face path{stroke:#fff}
.demo-bars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end;height:64px}
.demo-bars i{border-radius:8px 8px 5px 5px;background:color-mix(in srgb,#fff 22%,transparent);animation:rise 2.4s ease-in-out infinite}
.demo-bars i:nth-child(1){height:34%;animation-delay:0s}.demo-bars i:nth-child(2){height:50%;animation-delay:.12s}.demo-bars i:nth-child(3){height:66%;animation-delay:.24s}
.demo-bars i:nth-child(4){height:83%;background:#fff;animation-delay:.36s}.demo-bars i:nth-child(5){height:100%;animation-delay:.48s}
.demo-bars i:nth-child(-n+3){background:color-mix(in srgb,#fff 70%,transparent)}
@keyframes rise{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.86)}}
.demo-bars i{transform-origin:bottom}
.feat{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.feat li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;font-size:.95rem}
.feat li svg{width:34px;height:34px;padding:7px;border-radius:10px;background:color-mix(in srgb,#fff 16%,transparent);stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.feat li b{display:block;font-weight:600}
.feat li span{opacity:.8;font-size:.86rem}
.login-form{padding:48px 44px;display:grid;gap:18px;align-content:center}
.login-form h2{font-size:1.7rem}
.btn-google{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:1.02rem;transition:border-color .15s,box-shadow .15s,transform .1s}
.btn-google:hover{border-color:var(--accent);box-shadow:0 8px 20px -12px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn-google:active{transform:scale(.99)}
.btn-google svg{width:22px;height:22px}
.btn-google:disabled{opacity:.6}
.lock-note{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;color:var(--muted);padding:12px 14px;border-radius:12px;background:var(--bg)}
.lock-note svg{width:18px;height:18px;flex:none;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.err-box{border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line));background:color-mix(in srgb,var(--bad) 7%,var(--surface));color:var(--bad);border-radius:12px;padding:10px 14px;font-size:.9rem}
.err-box b{display:block}
.login-foot{font-size:.8rem;color:var(--muted);text-align:center}
@media (max-width:760px){
  .login{grid-template-columns:1fr;border-radius:22px}
  .login-art{padding:28px 24px;gap:20px}
  .feat{display:none}
  .login-form{padding:28px 24px 32px}
}
@media (prefers-reduced-motion:reduce){.demo-bars i{animation:none}}

/* ---------- แถบบนหน้าผู้ดูแล ---------- */
.topbar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:14px 18px;border-radius:18px;background:var(--accent);color:#fff}
.topbar .brand{opacity:1}
.topbar h1{color:#fff;font-size:1.15rem}
.topbar .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.topbar .chip{background:color-mix(in srgb,#fff 15%,transparent);border-color:color-mix(in srgb,#fff 30%,transparent);color:#fff}
.topbar button{background:color-mix(in srgb,#fff 14%,transparent);border-color:color-mix(in srgb,#fff 30%,transparent);color:#fff;border-radius:999px;padding:6px 14px}
.topbar button:hover{background:color-mix(in srgb,#fff 24%,transparent)}

/* ---------- กราฟ ---------- */
.charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px;align-items:start}
@media (max-width:820px){.charts{grid-template-columns:1fr}}
.chart-box{position:relative;border:1px solid var(--line);border-radius:14px;padding:14px 14px 8px;display:grid;gap:8px;min-width:0}
.chart-box h3{font-size:.98rem}
.chart-box canvas{width:100%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.82rem;padding:6px 10px;border-radius:8px;max-width:260px;z-index:3;line-height:1.45}

/* ---------- หน้าผู้ดูแล ---------- */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:8px 14px;color:var(--muted);font-weight:600}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{border-left:3px solid var(--accent);padding:2px 12px}
.stat b{display:block;font-size:1.4rem;font-family:var(--display);font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
table.report{border-collapse:collapse;width:100%;min-width:520px;font-size:.95rem;font-variant-numeric:tabular-nums}
table.report caption{text-align:left;caption-side:top;padding-bottom:6px}
table.report th,table.report td{border:1px solid var(--line);padding:6px 10px;vertical-align:middle}
table.report thead th{background:var(--th);text-align:center;font-weight:700}
table.report td.num{text-align:center;white-space:nowrap}
table.report tr.dimrow td{font-weight:700;background:var(--dimrow)}
table.report tr.sum td,table.report tr.total td{font-weight:700;background:var(--sumrow)}
.verdict-pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:.85rem;font-weight:600;border:1px solid currentColor}
.pass{color:var(--good)} .fail{color:var(--bad)}
.links{display:grid}
.link-row{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.link-row code{font-family:var(--body);font-size:.84rem;word-break:break-all;color:var(--muted)}
@media (max-width:560px){.link-row{grid-template-columns:1fr auto}.link-row code{grid-column:1/-1;grid-row:2}}
.comments{display:grid;gap:14px}
.comments ul{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}
.raw{font-size:.86rem;border-collapse:collapse}

function chartTheme(forDoc){
  if(forDoc) return {bg:"#ffffff", ink:"#1b2a33", muted:"#5d6e78", grid:"#e3e8eb", c:["#008a7c","#4053c9","#c05a0c","#9b3fa8","#5f7f12","#c2185b"], total:"#3d4b55", ref:"#b3362f"};

function wrapText(ctx, text, maxW, maxLines){
  const seg = typeof Intl !== "undefined" && Intl.Segmenter ? [...new Intl.Segmenter("th", {granularity:"word"}).segment(text)].map(x => x.segment) : [...text];
  const lines = []; let cur = "";
  for(const w of seg){
    if(ctx.measureText(cur + w).width <= maxW || !cur){ cur += w; continue; }
    lines.push(cur.trim()); cur = w.trimStart();
    if(lines.length === maxLines) break;
  }
  if(lines.length < maxLines && cur) lines.push(cur.trim());
  else if(cur && lines.length === maxLines){ let l = lines[maxLines-1]; while(l && ctx.measureText(l + "…").width > maxW) l = [...l].slice(0,-1).join(""); lines[maxLines-1] = l + "…"; }
  return lines;
}
/* spec: {kind:"h"|"v", bars:[{label, value, sd, color, tip}], width, ref} → วาดลง canvas คืนตำแหน่งแท่งสำหรับ tooltip */
function drawChart(canvas, spec, theme, scale = 2){

    plot = {x0: labelW, x1: W - 46, y0: 28, rowH};
    H = plot.y0 + n * rowH + 30;
  } else {
    plot = {x0: 34, x1: W - 10, y0: 40, y1: 220};
    meas.font = font(12);
    lines = spec.bars.map(b => wrapText(meas, b.label, (plot.x1 - plot.x0) / n - 8, 2));
    H = plot.y1 + 46;
  }
  canvas.width = W * scale; canvas.height = H * scale;
  canvas.style.aspectRatio = `${W} / ${H}`;
  const ctx = canvas.getContext("2d"); ctx.scale(scale, scale);
  ctx.fillStyle = theme.bg; ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = "middle";
  const hits = [];
  const rr = (x, y, w, h, r, ends) => { // มุมโค้งเฉพาะปลายแท่ง
    ctx.beginPath();
    if(ends === "right"){ ctx.moveTo(x, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r); ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x, y + h); }

    const M = spec.max || 5, X = v => plot.x0 + (plot.x1 - plot.x0) * v / M, yEnd = plot.y0 + n * plot.rowH;
    ctx.font = font(11); ctx.textAlign = "center";
    for(let t = 0; t <= M; t++){ ctx.strokeStyle = theme.grid; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(X(t), plot.y0 - 4); ctx.lineTo(X(t), yEnd); ctx.stroke(); ctx.fillStyle = theme.muted; ctx.fillText(t, X(t), yEnd + 14); }
    spec.bars.forEach((b, i) => {
      const yc = plot.y0 + i * plot.rowH + plot.rowH / 2, bh = 16;
      ctx.font = font(13); ctx.fillStyle = theme.ink; ctx.textAlign = "left";
      const L = lines[i], lh = 16; L.forEach((t, k) => ctx.fillText(t, 4, yc + (k - (L.length - 1) / 2) * lh));
      ctx.fillStyle = b.color; rr(X(0), yc - bh / 2, Math.max(4, X(b.value) - X(0)), bh, 4, "right");
      ctx.font = font(12, 600); ctx.fillStyle = theme.ink; ctx.textAlign = "left"; ctx.fillText(f2(b.value), X(b.value) + 6, yc);
      hits.push({x: 0, y: yc - plot.rowH / 2, w: W, h: plot.rowH, b});
    });
    if(spec.ref && spec.ref > 0){ ctx.strokeStyle = theme.ref; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(X(spec.ref), plot.y0 - 8); ctx.lineTo(X(spec.ref), yEnd); ctx.stroke(); ctx.setLineDash([]);
      ctx.font = font(11, 600); ctx.fillStyle = theme.ref; ctx.textAlign = "center"; ctx.fillText(`เกณฑ์ ${spec.ref.toFixed(2)}`, X(spec.ref), plot.y0 - 12); }
  } else {
    const M = spec.max || 5, Y = v => plot.y1 - (plot.y1 - plot.y0) * v / M, slot = (plot.x1 - plot.x0) / n, bw = Math.min(64, slot * 0.56);
    ctx.font = font(11); ctx.textAlign = "right";
    for(let t = 0; t <= M; t++){ ctx.strokeStyle = theme.grid; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(plot.x0, Y(t)); ctx.lineTo(plot.x1, Y(t)); ctx.stroke(); ctx.fillStyle = theme.muted; ctx.fillText(t, plot.x0 - 8, Y(t)); }
    spec.bars.forEach((b, i) => {

      ctx.fillStyle = b.color; rr(xc - bw / 2, Y(b.value), bw, Y(0) - Y(b.value), 4, "top");
      ctx.font = font(13, 600); ctx.fillStyle = theme.ink; ctx.textAlign = "center"; ctx.fillText(f2(b.value), xc, Y(b.value) - 11);
      ctx.font = font(12); ctx.fillStyle = theme.ink; lines[i].forEach((t, k) => ctx.fillText(t, xc, plot.y1 + 14 + k * 16));
      hits.push({x: plot.x0 + slot * i, y: plot.y0, w: slot, h: plot.y1 - plot.y0 + 40, b});
    });
    if(spec.ref && spec.ref > 0){ ctx.strokeStyle = theme.ref; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(plot.x0, Y(spec.ref)); ctx.lineTo(plot.x1, Y(spec.ref)); ctx.stroke(); ctx.setLineDash([]);
      ctx.font = font(11, 600); ctx.fillStyle = theme.ref; ctx.textAlign = "right"; const lt = `เกณฑ์ ${spec.ref.toFixed(2)}`, tw = ctx.measureText(lt).width;
      ctx.fillText(lt, plot.x1, 10); ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(plot.x1 - tw - 30, 10); ctx.lineTo(plot.x1 - tw - 6, 10); ctx.stroke(); ctx.setLineDash([]); }
  }

}
function mountChart(box, spec){
  const cv = box.querySelector("canvas"), tip = box.querySelector(".tip");
  const {hits, W} = drawChart(cv, spec, chartTheme(false), Math.max(2, devicePixelRatio || 1));
  cv.onmousemove = e => {
    const r = cv.getBoundingClientRect(), k = W / r.width, x = (e.clientX - r.left) * k, y = (e.clientY - r.top) * k;
    const h = hits.find(h => x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h);
    if(!h){ tip.hidden = true; cv.style.cursor = ""; return; }
    cv.style.cursor = "default"; tip.innerHTML = h.b.tip; tip.hidden = false;
    const bx = box.getBoundingClientRect();
    tip.style.left = Math.min(e.clientX - bx.left + 12, bx.width - tip.offsetWidth - 6) + "px";
    tip.style.top = (e.clientY - bx.top + 14) + "px";
  };

}

    g.fillStyle = th.ink; g.textBaseline = "middle"; g.font = `700 15px ${CHART_FONT}`; g.fillText(header.title, 4, 18);
    if(header.legend){ let x = 4; g.font = `400 12px ${CHART_FONT}`;
      header.legend.forEach(([t, c]) => { g.fillStyle = c; g.fillRect(x, 40, 10, 10); g.fillStyle = th.muted; g.fillText(t, x + 15, 46); x += g.measureText(t).width + 34; }); }

/* คืนช่วงคะแนนจากระดับสูงสุดไปต่ำสุด: 5 ระดับใช้เกณฑ์ของบุญชม ศรีสะอาด, 3–4 ระดับใช้อันตรภาคชั้น (สูงสุด−ต่ำสุด)/จำนวนชั้น */
function bands(scale){
  const k = scale.points, L = scale.labels || DEFAULT_LABELS[k];
  if(k === 5) return [[5,4.51,5],[4,3.51,4.5],[3,2.51,3.5],[2,1.51,2.5],[1,1,1.5]].map(([v,lo,hi],i) => ({v, lo, hi, label: L[i]}));
  const w = (k - 1) / k, out = [];
  for(let i = 0; i < k; i++){
    const top = i === 0 ? k : floor2(k - i * w), bottom = i === k - 1 ? 1 : floor2(k - (i + 1) * w) + 0.01;
    out.push({v: k - i, lo: r2(bottom), hi: r2(top), label: L[i]});
  }
  return out;
}

function lv(sv, m){
  if(m === undefined || isNaN(m)) return "-";
  const x = r2(m), b = bands(sv.scale);
  return (b.find(z => x >= z.lo) || b[b.length - 1]).label;
}

const ratingParts = sv => sv.parts.filter(p => p.kind === "rating" && p.items.length);
const allQuestions = sv => sv.parts.filter(p => p.kind === "questions").flatMap(p => p.questions);
function itemNo(sv){ const m = {}; let n = 0; ratingParts(sv).forEach(p => p.items.forEach(it => m[it.id] = ++n)); return m; }
function computeS(sv, rows){
  const rp = ratingParts(sv), all = rp.flatMap(p => p.items);
  const val = (r, id) => +(r.ratings?.[id]) || 0;
  const meanOf = (r, list) => { const v = list.map(it => val(r, it.id)).filter(x => x > 0); return v.length ? avg(v) : null; };
  return {
    n: rows.length, rp, all,
    items: Object.fromEntries(all.map(it => [it.id, stats(rows.map(r => val(r, it.id)).filter(x => x > 0))])),
    parts: rp.map(p => stats(rows.map(r => meanOf(r, p.items)).filter(x => x !== null))),
    total: stats(rows.map(r => meanOf(r, all)).filter(x => x !== null))
  };
}
function narrativeS(sv, res, who){
  const W = sv.scale.word, no = itemNo(sv), txt = id => res.all.find(it => it.id === id)?.text;
  const its = res.all.map(it => ({id: it.id, s: res.items[it.id]})).filter(x => x.s.n).sort((a,b) => b.s.mean - a.s.mean);
  if(!res.total.n) return "";
  let out = `ผลการสำรวจความ${W}ของ${who} จำนวน ${res.n} คน พบว่า มีความ${W}โดยรวมอยู่ในระดับ${lv(sv, res.total.mean)} (x̄ = ${f2(res.total.mean)}, S.D. = ${f2(res.total.sd)})`;
  if(res.rp.length > 1){
    const ds = res.parts.map((s,i) => ({s, i})).sort((a,b) => b.s.mean - a.s.mean);
    out += ` เมื่อพิจารณาเป็นรายด้าน เรียงจากมากไปน้อย ได้แก่ ${ds.map(({s,i}) => `${res.rp[i].title} อยู่ในระดับ${lv(sv, s.mean)} (x̄ = ${f2(s.mean)}, S.D. = ${f2(s.sd)})`).join(" ")}`;
  }
  if(its.length > 1) out += ` ข้อที่มีค่าเฉลี่ยสูงสุด คือ ${txt(its[0].id)} (x̄ = ${f2(its[0].s.mean)}) และข้อที่มีค่าเฉลี่ยต่ำสุด คือ ${txt(its.at(-1).id)} (x̄ = ${f2(its.at(-1).s.mean)})`;
  const pass = +sv.scale.pass;
  if(pass) out += r2(res.total.mean) >= pass ? ` ค่าเฉลี่ยโดยรวมผ่านเกณฑ์ที่กำหนด (${pass.toFixed(2)} ขึ้นไป)` : ` ค่าเฉลี่ยโดยรวมยังไม่ผ่านเกณฑ์ที่กำหนด (${pass.toFixed(2)} ขึ้นไป)`;
  return out;
}
function freqQ(rows, qq){
  const c = new Map(); qq.options.forEach(o => c.set(o, 0));
  rows.forEach(r => { const a = r.answers?.[qq.id]; (Array.isArray(a) ? a : a ? [a] : []).forEach(v => c.set(v, (c.get(v) || 0) + 1)); });
  const answered = rows.filter(r => { const a = r.answers?.[qq.id]; return Array.isArray(a) ? a.length : a; }).length;
  return {list: [...c], answered};
}
function groupTexts(rows, qid){
  const m = new Map();
  rows.forEach(r => { const t = String(r.answers?.[qid] || "").trim(); if(!t) return; const k = t.replace(/\s+/g, " ");
    if(!m.has(k)) m.set(k, {t, n:0, groups:new Set()}); const g = m.get(k); g.n++; g.groups.add(groupOf(r)); });
  return [...m.values()].sort((a,b) => b.n - a.n);
}

const fb = CONFIG.firebaseConfig;
const DEMO = !fb.apiKey || !fb.projectId || location.protocol === "file:" || location.hostname === "localhost" || location.hostname === "127.0.0.1";
const store = {};
async function initStore(){
  if(DEMO){
    let S_ = lsGet("sat3_surveys", null), R_ = lsGet("sat3_rows", null);
    if(!S_ || !S_.length){ S_ = [SHEET_SURVEY]; lsSet("sat3_surveys", S_); }
    if(!R_ || !R_.length){ R_ = clone(SHEET_RESPONSES); lsSet("sat3_rows", R_); }
    const subs = {s: null, r: null};
    const emitS = () => subs.s && subs.s(clone(S_)), emitR = () => subs.r && subs.r(clone(R_));
    const saveS = () => { lsSet("sat3_surveys", S_); emitS(); }, saveR = () => { lsSet("sat3_rows", R_); emitR(); };
    store.getSurvey = async id => clone(S_.find(s => s.id === id) || null);
    store.watchSurveys = cb => { subs.s = cb; emitS(); return () => subs.s = null; };
    store.saveSurvey = async sv => { const x = clone({...sv, updatedAt: Date.now()}); S_ = S_.filter(s => s.id !== sv.id).concat(x); saveS(); };
    store.deleteSurvey = async id => { S_ = S_.filter(s => s.id !== id); saveS(); };
    store.addResponse = async d => { R_.push({...clone(d), id: rid(10), createdAt: Date.now()}); saveR(); };
    store.addMany = async arr => { arr.forEach(d => R_.push({...clone(d), id: rid(10), createdAt: Date.now() - Math.random() * 864e5})); saveR(); };
    store.watchResponses = cb => { subs.r = cb; emitR(); return () => subs.r = null; };
    store.removeResponse = async id => { R_ = R_.filter(r => r.id !== id); saveR(); };
    store.clear = async () => { S_ = []; R_ = []; saveS(); saveR(); };
    store.signIn = async () => {}; store.signOut = async () => {};
    store.onAuth = cb => cb({email:"โหมดทดลอง (ออฟไลน์)", demo:true});
    return;
  }
  const V = "10.12.2";
  const [{initializeApp}, fs, au] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`)
  ]);
  const fapp = initializeApp(fb), db = fs.getFirestore(fapp), auth = au.getAuth(fapp);
  const colS = fs.collection(db, CONFIG.COL_SURVEYS), colR = fs.collection(db, CONFIG.COL_RESP);
  store.getSurvey = async id => { const d = await fs.getDoc(fs.doc(db, CONFIG.COL_SURVEYS, id)); return d.exists() ? {id: d.id, ...d.data()} : null; };
  store.watchSurveys = (cb, err) => fs.onSnapshot(colS, s => cb(s.docs.map(d => ({id: d.id, ...d.data()}))), err);
  store.saveSurvey = sv => { const {id, ...data} = clone(sv); return fs.setDoc(fs.doc(db, CONFIG.COL_SURVEYS, id), {...data, updatedAt: Date.now()}); };
  store.deleteSurvey = id => fs.deleteDoc(fs.doc(db, CONFIG.COL_SURVEYS, id));
  store.addResponse = d => fs.addDoc(colR, {...clone(d), createdAt: fs.serverTimestamp()});
  store.watchResponses = (cb, err) => fs.onSnapshot(colR, s => cb(s.docs.map(x => { const v = x.data(); return {...v, id: x.id, createdAt: v.createdAt?.toMillis?.() || 0}; })), err);
  store.removeResponse = id => fs.deleteDoc(fs.doc(db, CONFIG.COL_RESP, id));
  store.signIn = () => au.signInWithPopup(auth, new au.GoogleAuthProvider());
  store.signOut = () => au.signOut(auth);
  store.onAuth = cb => au.onAuthStateChanged(auth, cb);
}
const storeReady = initStore();

const faceSVG = (v, k = 5, size) => {
  const c = v ? (((v - 1) / (k - 1)) * 2 - 1) * 6.4 : 0;
  return `<svg class="face" viewBox="0 0 40 40" aria-hidden="true"${size ? ` style="width:${size}px;height:${size}px"` : ""}><circle class="head" cx="20" cy="20" r="17"/><circle class="eye" cx="14" cy="16" r="2.1"/><circle class="eye" cx="26" cy="16" r="2.1"/><path d="M12.5 ${27 - c/2} Q20 ${27 + c} 27.5 ${27 - c/2}"/></svg>`;
};
const safeName = s => String(s).replace(/[\\/:*?"<>|]/g, "_").slice(0, 60);
const fmtDate = t => t ? new Date(t).toLocaleDateString("th-TH", {day:"numeric", month:"short", year:"2-digit"}) : "";

/* ================= ฝั่งผู้ตอบ ================= */
const P = new URLSearchParams(location.search);
let ctx = {sid: P.get("s") || "", group: (P.get("g") || "").trim(), survey: null, preview: false, loading: !!P.get("s")};
let S;
function resetAnswer(){ S = {step: 0, group: ctx.group, answers: {}, ratings: {}, sending: false}; }
resetAnswer();
const steps = () => ctx.survey.parts.filter(p => p.kind === "questions" ? p.questions.length : p.items.length);
const stepColor = (sv, p) => p.kind === "rating" ? partColor(ratingParts(sv).indexOf(p)) : "var(--d4)";
const doneKey = () => "sat3_done_" + ctx.sid + "_" + (ctx.group || "");

function stepper(){
  const st = steps(), k = S.step;
  return `<div class="stepper">
    <div class="segs" style="grid-template-columns:repeat(${st.length},1fr)">${st.map((p,i) => `<i style="${i < k ? `background:${stepColor(ctx.survey, p)}` : ""}"></i>`).join("")}</div>
    <div class="step-label"><span>ส่วนที่ ${k} จาก ${st.length} · <b>${esc(st[k-1].title)}</b></span><span>${esc(S.group || "")}</span></div>
  </div>`;
}
function navbar(nextLabel, last){
  return `<div class="navbar"><span class="msg" id="msg" hidden></span>
    <div class="row"><button class="btn-back" id="back">${ico("back")}ย้อนกลับ</button><button class="btn-go" id="next">${nextLabel}${ico(last ? "send" : "next")}</button></div></div>`;
}
function go(step){ S.step = step; renderStudent(); window.scrollTo({top: 0}); }
function showMsg(t){ const m = $("#msg"); m.textContent = t; m.hidden = false; }
function previewBar(){ return ctx.preview ? `<div class="banner" style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><span>ตัวอย่างสิ่งที่ผู้ตอบจะเห็น (ไม่บันทึกคำตอบ)</span><button class="small" id="exitPrev">กลับไปแก้ไข</button></div>` : ""; }
function bindPreview(){ const b = $("#exitPrev"); if(b) b.onclick = () => { ctx = {sid: "", group: "", survey: null, preview: false, loading: false}; A.tab = "edit"; renderAdmin(); window.scrollTo({top:0}); }; }

function renderStudent(){
  app.className = "wrap";
  if(ctx.loading){ app.innerHTML = `<div class="card" style="margin-top:30px">กำลังโหลดแบบสอบถาม…</div>`; return; }
  const sv = ctx.survey;
  if(!sv){ app.innerHTML = `<div class="card" style="display:grid;gap:10px;margin-top:30px"><h1>ไม่พบแบบสอบถาม</h1><p class="muted">ลิงก์อาจไม่ถูกต้องหรือแบบสอบถามถูกลบไปแล้ว ขอลิงก์จากผู้ส่งอีกครั้ง</p></div>`; return; }
  if(sv.status === "closed" && !ctx.preview){ app.innerHTML = `<div class="card" style="display:grid;gap:10px;margin-top:30px"><span class="eyebrow">${esc(sv.title)}</span><h1>แบบสอบถามนี้ปิดรับคำตอบแล้ว</h1><p class="muted">ขอบคุณที่สนใจ หากมีข้อสงสัยโปรดติดต่อผู้ส่งแบบสอบถาม</p></div>`; return; }
  const st = steps();
  if(S.step === 0) return renderLanding();
  if(S.step <= st.length) return renderPart(st[S.step - 1], S.step === st.length);
  return renderThanks();
}
function renderLanding(){
  const sv = ctx.survey, st = steps(), needGroup = sv.groupLabel && !ctx.group;
  let done = false; try { done = !ctx.preview && localStorage.getItem(doneKey()) === "1"; } catch {}
  app.innerHTML = `${previewBar()}${demoBanner()}
    <section class="hero">
      <span class="eyebrow">${esc(sv.audience ? "สำหรับ" + sv.audience : "แบบสอบถาม")}</span>
      <div class="media-name">${esc(sv.title)}</div>
      <div class="row">${ctx.group ? `<span class="chip">${esc(sv.groupLabel || "กลุ่ม")} <b>${esc(ctx.group)}</b></span>` : ""}${sv.minutes ? `<span class="chip">ใช้เวลาประมาณ <b>${esc(sv.minutes)} นาที</b></span>` : ""}<span class="chip">ไม่ต้องระบุชื่อ</span></div>
      ${sv.description ? `<p class="muted">${esc(sv.description)}</p>` : ""}
    </section>
    ${done ? `<div class="banner">อุปกรณ์นี้เคยส่งแบบสอบถามนี้แล้ว ถ้าเป็นผู้ตอบคนอื่นที่ใช้เครื่องร่วมกัน ทำต่อได้ตามปกติ</div>` : ""}
    <div class="card plan">
      <h3 style="margin-bottom:4px">แบบสอบถามมี ${st.length} ส่วน</h3>
      ${st.map((p,i) => `<div class="plan-item" style="--dc:${stepColor(sv, p)}"><span class="plan-dot">${i+1}</span><span>${esc(p.title)}</span><span class="muted small">${p.kind === "rating" ? p.items.length : p.questions.length} ข้อ</span></div>`).join("")}
    </div>
    ${needGroup ? `<div class="card field" id="f-group"><label class="f">${esc(sv.groupLabel)}<input type="text" id="grp" maxlength="40" value="${esc(S.group)}" placeholder="พิมพ์${esc(sv.groupLabel)}"></label></div>` : ""}
    <div class="navbar"><span class="msg" id="msg" hidden></span><button class="btn-go wide" id="start">เริ่มทำแบบสอบถาม${ico("next")}</button></div>`;
  bindPreview();
  $("#start").onclick = () => {
    if(needGroup){ S.group = $("#grp").value.trim(); if(!S.group){ $("#f-group").classList.add("missing"); return showMsg(`กรุณาระบุ${sv.groupLabel}`); } }
    go(1);
  };
}
function optTile(p, qq, o, multi){
  const cur = S.answers[qq.id], on = multi ? (cur || []).includes(o) : cur === o;
  return `<button type="button" class="opt" data-q="${qq.id}" data-v="${esc(o)}" data-multi="${multi ? 1 : ""}" aria-pressed="${on}"><span class="tick">${ico("tick")}</span>${ICON[o] ? ico(o) : ""}<span>${esc(o === "โทรศัพท์มือถือ" ? "มือถือ" : o)}</span></button>`;
}
function renderPart(p, last){
  const sv = ctx.survey, k = sv.scale.points, color = stepColor(sv, p), idx = steps().indexOf(p) + 1;
  let body;
  if(p.kind === "questions"){
    body = `<div class="card" style="display:grid;gap:24px">${p.questions.map(qq => {
      if(qq.type === "text") return `<div class="field" id="f-${qq.id}"><label class="f">${esc(qq.text)}${qq.required ? "" : ` <span class="hint">(ไม่บังคับ)</span>`}<textarea data-text="${qq.id}" rows="3" maxlength="800">${esc(S.answers[qq.id] || "")}</textarea></label></div>`;
      const multi = qq.type === "multi";
      return `<div class="field" id="f-${qq.id}"><div class="flabel">${esc(qq.text)}${multi ? ` <small>เลือกได้มากกว่า 1 ข้อ</small>` : ""}${qq.required ? "" : ` <small>(ไม่บังคับ)</small>`}</div><div class="opts" style="grid-template-columns:repeat(${Math.min(3, qq.options.length) || 1},minmax(0,1fr))">${qq.options.map(o => optTile(p, qq, o, multi)).join("")}</div></div>`;
    }).join("")}</div>`;
  } else {
    const L = bands(sv.scale);
    body = p.items.map((it, j) => `<div class="qcard" id="q${it.id}" style="--dc:${color}">
      <div class="qhead"><span class="qno">${j+1}</span><p class="qtext">${esc(it.text)}</p></div>
      <div class="meter"><span class="facebox">${faceSVG(0, k)}</span>
        <div class="bars" role="radiogroup" aria-label="ข้อ ${j+1}" style="grid-template-columns:repeat(${k},1fr)">
          ${Array.from({length: k}, (_, x) => x + 1).map(v => `<button type="button" class="bar" role="radio" data-i="${it.id}" data-v="${v}" aria-checked="false" aria-label="${v} ${levelFull(sv, v)}" style="height:${Math.round(34 + 66 * (v - 1) / (k - 1))}%">${v}</button>`).join("")}
        </div></div>
      <div class="meter-foot"><span></span><div><div class="scale-ends"><span>${esc(L.at(-1).label)}</span><span>${esc(L[0].label)}</span></div><div class="verdict empty" id="vd${it.id}"></div></div></div>
    </div>`).join("");
  }
  app.innerHTML = `${previewBar()}${stepper()}
    <div class="dimhead" style="--dc:${color}"><span class="num">${idx}</span><h2>${esc(p.title)}</h2><p>${p.kind === "rating" ? `${p.items.length} ข้อ · แตะแท่งระดับ 1 (${esc(bands(sv.scale).at(-1).label)}) ถึง ${k} (${esc(bands(sv.scale)[0].label)})` : "กรอกข้อมูลตามความเป็นจริง"}</p></div>
    ${body}
    ${navbar(last ? (ctx.preview ? "จบตัวอย่าง" : "ส่งแบบสอบถาม") : "ถัดไป", last)}`;
  bindPreview();
  if(p.kind === "rating") p.items.forEach(it => paintItem(it.id));
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const id = b.dataset.q, v = b.dataset.v;
    if(b.dataset.multi){ const cur = new Set(S.answers[id] || []); cur.has(v) ? cur.delete(v) : cur.add(v); S.answers[id] = [...cur]; b.setAttribute("aria-pressed", cur.has(v)); }
    else { S.answers[id] = v; app.querySelectorAll(`.opt[data-q="${id}"]`).forEach(x => x.setAttribute("aria-pressed", x === b)); }
    $("#f-" + id)?.classList.remove("missing");
  });
  app.querySelectorAll("[data-text]").forEach(t => t.oninput = () => { S.answers[t.dataset.text] = t.value; });
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  app.querySelectorAll(".bar").forEach(b => {
    const id = b.dataset.i, v = +b.dataset.v;
    b.onclick = () => {
      const first = !S.ratings[id]; S.ratings[id] = v; paintItem(id);
      if(first){ const nx = p.items.find(it => !S.ratings[it.id]); if(nx) setTimeout(() => $("#q" + nx.id)?.scrollIntoView({behavior: reduce ? "auto" : "smooth", block: "center"}), 280); }
    };
    b.onkeydown = e => {
      const dir = {ArrowRight:1, ArrowUp:1, ArrowLeft:-1, ArrowDown:-1}[e.key]; if(!dir) return; e.preventDefault();
      const nv = Math.min(k, Math.max(1, (S.ratings[id] || Math.ceil(k / 2)) + (S.ratings[id] ? dir : 0)));
      S.ratings[id] = nv; paintItem(id); $(`#q${id} .bar[data-v="${nv}"]`).focus();
    };
  });
  $("#back").onclick = () => go(S.step - 1);
  $("#next").onclick = async () => {
    const miss = [];
    if(p.kind === "rating") p.items.forEach((it, j) => { if(!S.ratings[it.id]){ miss.push(j + 1); $("#q" + it.id).classList.add("missing"); } });
    else p.questions.forEach((qq, j) => { const a = S.answers[qq.id]; const empty = Array.isArray(a) ? !a.length : !String(a || "").trim();
      if(qq.required && empty){ miss.push(qq.text); $("#f-" + qq.id).classList.add("missing"); } });
    if(miss.length){ showMsg(p.kind === "rating" ? `ยังไม่ได้ตอบข้อ ${miss.join(", ")}` : `กรุณาตอบ: ${miss.join(", ")}`); app.querySelector(".missing")?.scrollIntoView({behavior: reduce ? "auto" : "smooth", block: "center"}); return; }
    if(!last) return go(S.step + 1);
    if(ctx.preview) return go(S.step + 1);
    if(S.sending) return;
    S.sending = true; const btn = $("#next"); btn.disabled = true; btn.innerHTML = "กำลังส่ง…";
    try{
      await storeReady;
      const answers = {}; allQuestions(sv).forEach(qq => { const a = S.answers[qq.id]; if(a !== undefined && !(Array.isArray(a) && !a.length) && String(a).trim() !== "") answers[qq.id] = Array.isArray(a) ? a : String(a).trim().slice(0, 800); });
      const ratings = {}; ratingParts(sv).forEach(pp => pp.items.forEach(it => { if(S.ratings[it.id]) ratings[it.id] = S.ratings[it.id]; }));
      await store.addResponse({surveyId: ctx.sid, group: (S.group || "").slice(0, 40), answers, ratings});
      try { localStorage.setItem(doneKey(), "1"); } catch {}
      go(S.step + 1);
    }catch(e){
      S.sending = false; btn.disabled = false; btn.innerHTML = "ส่งแบบสอบถาม" + ico("send");
      showMsg("ส่งไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วกดส่งอีกครั้ง (" + (e.code || e.message) + ")");
    }
  };
}
function paintItem(id){
  const card = $("#q" + id); if(!card) return;
  const sv = ctx.survey, k = sv.scale.points, v = S.ratings[id];
  card.classList.toggle("done", !!v); if(v) card.classList.remove("missing");
  card.querySelectorAll(".bar").forEach(b => {
    const bv = +b.dataset.v;
    b.classList.toggle("fill", !!v && bv <= v); b.classList.toggle("sel", bv === v);
    b.style.setProperty("--k", 45 + Math.round(55 * bv / k));
    b.setAttribute("aria-checked", bv === v); b.tabIndex = (v ? bv === v : bv === Math.ceil(k / 2)) ? 0 : -1;
  });
  card.querySelector(".facebox").innerHTML = faceSVG(v, k);
  const vd = $("#vd" + id); vd.textContent = v ? `${v} · ${levelFull(sv, v)}` : "แตะแท่งเพื่อเลือกระดับ"; vd.classList.toggle("empty", !v);
}
function renderThanks(){
  const sv = ctx.survey;
  app.innerHTML = `${previewBar()}<div class="card thanks" style="--dc:var(--c1)">${faceSVG(5, 5, 84)}
    <h1>${ctx.preview ? "จบตัวอย่างแบบสอบถาม" : "ขอบคุณที่ตอบแบบสอบถาม"}</h1>
    <p class="muted">${ctx.preview ? "ในการใช้งานจริง คำตอบจะถูกบันทึกเมื่อผู้ตอบกดส่ง" : `ส่งคำตอบ “${esc(sv.title)}” เรียบร้อยแล้ว`}</p>
    ${DEMO && !ctx.preview ? `<div class="row" style="justify-content:center"><button id="again" class="btn-back">${ico("back")}ทดลองตอบอีกครั้ง</button><a class="btn" href="#admin">ไปหน้าผู้ดูแล</a></div>` : ""}</div>`;
  bindPreview();
  if($("#again")) $("#again").onclick = () => { resetAnswer(); renderStudent(); };
}

/* ================= ฝั่งผู้ดูแล ================= */
let A = {tab: "results", surveys: [], rows: [], sel: "gemini_tpack_addie", group: "__all", draft: null, picking: false, user: undefined, unS: null, unR: null};
const isAdminView = () => location.hash === "#admin" || !ctx.sid;
const countOf = sid => A.rows.filter(r => r.surveyId === sid).length;
const svById = id => A.surveys.find(s => s.id === id);

  app.className = "wrap wide";
  const u = A.user;

/* ----- คลังแบบสอบถาม ----- */
function renderLibrary(){
  const panel = $("#panel");
  if(A.picking){
    panel.innerHTML = `<div class="row between"><div><h2>สร้างแบบสอบถามใหม่</h2><p class="muted small">เลือกแม่แบบเพื่อเริ่มต้น แล้วแก้ไขข้อคำถามได้ทั้งหมด</p></div><button class="btn-back" id="cancelPick">${ico("back")}กลับคลัง</button></div>
      <div class="lib-grid">${TEMPLATES.map((t,i) => `<button class="tpl" data-tpl="${i}"><b>${esc(t.name)}</b><span class="muted small">${esc(t.note)}</span></button>`).join("")}</div>`;
    $("#cancelPick").onclick = () => { A.picking = false; renderLibrary(); };
    panel.querySelectorAll("[data-tpl]").forEach(b => b.onclick = () => { const t = TEMPLATES[+b.dataset.tpl]; A.draft = {id: rid(10), status: "open", createdAt: Date.now(), ...t.make(), isNew: true}; A.picking = false; A.tab = "edit"; renderAdmin(); });
    return;
  }
  const list = A.surveys;

    if(act === "copy"){ const c = clone(sv); c.id = rid(10); c.title = sv.title + " (สำเนา)"; c.status = "open"; c.createdAt = Date.now(); await store.saveSurvey(c); return toast("ทำสำเนาแล้ว"); }
    if(act === "toggle"){ await store.saveSurvey({...sv, status: sv.status === "closed" ? "open" : "closed"}); return toast(sv.status === "closed" ? "เปิดรับคำตอบแล้ว" : "ปิดรับคำตอบแล้ว"); }
    if(act === "del"){
      if(b.dataset.arm !== "1"){ b.dataset.arm = "1"; b.textContent = countOf(sv.id) ? `ยืนยันลบ (รวม ${countOf(sv.id)} คำตอบ)` : "ยืนยันลบ"; return; }
      b.disabled = true;
      for(const r of A.rows.filter(r => r.surveyId === sv.id)) await store.removeResponse(r.id);
      await store.deleteSurvey(sv.id); toast("ลบแล้ว");
    }
  });
}

function edErr(t){ const m = $("#edMsg"); if(m) m.textContent = t; toast(t); }
function validate(d){
  if(!d.title.trim()) return "กรุณาตั้งชื่อแบบสอบถาม";
  if(!d.parts.length) return "ต้องมีอย่างน้อย 1 ส่วน";
  for(const p of d.parts){
    if(!p.title.trim()) return "มีส่วนที่ยังไม่ได้ตั้งชื่อ";
    if(p.kind === "rating" && !p.items.length) return `“${p.title}” ยังไม่มีข้อคำถาม`;
    if(p.kind === "questions"){
      if(!p.questions.length) return `“${p.title}” ยังไม่มีคำถาม`;
      for(const qq of p.questions){ if(!qq.text.trim()) return `มีคำถามใน “${p.title}” ที่ยังว่าง`; if(qq.type !== "text" && qq.options.length < 2) return `“${qq.text}” ต้องมีตัวเลือกอย่างน้อย 2 ตัว`; }
    }
  }
  if(!ratingParts(d).length) return "ต้องมีด้านที่เป็นมาตราส่วนอย่างน้อย 1 ด้าน";
  return "";
}
async function saveDraft(){
  const d = A.draft, err = validate(d); if(err) return edErr(err);
  const sv = clone(d); delete sv.isNew;
  sv.title = sv.title.trim(); sv.parts.forEach(p => { p.title = p.title.trim(); if(p.questions) p.questions.forEach(qq => { qq.text = qq.text.trim(); if(qq.type === "text") qq.options = []; }); });
  try { await store.saveSurvey(sv); A.draft = null; A.tab = "library"; renderAdmin(); toast("บันทึกแบบสอบถามแล้ว"); }
  catch(e){ edErr("บันทึกไม่สำเร็จ: " + (e.code || e.message)); }
}
function drawParts(){
  const d = A.draft, box = $("#edParts"); let ri = -1;
  box.innerHTML = d.parts.map((p, i) => {
    const color = p.kind === "rating" ? partColor(++ri) : "var(--d4)";
    const head = `<div class="part-head"><span class="part-no" style="background:${color}">${i+1}</span>
      <input type="text" class="part-title" data-pt="${i}" value="${esc(p.title)}" maxlength="120" placeholder="ชื่อส่วน">
      <span class="chip">${p.kind === "rating" ? "มาตราส่วน" : "คำถามทั่วไป"}</span>
      <div class="row" style="gap:4px"><button class="icon-btn" data-mv="${i}" data-dir="-1" aria-label="เลื่อนขึ้น" ${i === 0 ? "disabled" : ""}>↑</button><button class="icon-btn" data-mv="${i}" data-dir="1" aria-label="เลื่อนลง" ${i === d.parts.length - 1 ? "disabled" : ""}>↓</button><button class="icon-btn danger" data-rm="${i}" aria-label="ลบส่วนนี้">✕</button></div></div>`;
    if(p.kind === "rating") return `<div class="card part" style="--dc:${color}">${head}
      <label class="f">ข้อคำถาม <span class="hint">พิมพ์บรรทัดละ 1 ข้อ · ตอนนี้มี <b data-cnt="${i}">${p.items.length}</b> ข้อ</span><textarea data-items="${i}" rows="${Math.max(4, p.items.length + 1)}">${esc(p.items.map(it => it.text).join("\n"))}</textarea></label></div>`;
    return `<div class="card part" style="--dc:${color}">${head}
      ${p.questions.map((qq, j) => `<div class="qrow">
        <select data-qt="${i}:${j}"><option value="single" ${qq.type === "single" ? "selected" : ""}>เลือก 1 ข้อ</option><option value="multi" ${qq.type === "multi" ? "selected" : ""}>เลือกได้หลายข้อ</option><option value="text" ${qq.type === "text" ? "selected" : ""}>ปลายเปิด (พิมพ์ตอบ)</option></select>
        <input type="text" data-qx="${i}:${j}" value="${esc(qq.text)}" maxlength="200" placeholder="ข้อความคำถาม">
        <label class="req"><input type="checkbox" data-qr="${i}:${j}" ${qq.required ? "checked" : ""}> บังคับตอบ</label>
        <button class="icon-btn danger" data-qd="${i}:${j}" aria-label="ลบคำถาม">✕</button>
        ${qq.type === "text" ? "" : `<label class="f qopts">ตัวเลือก <span class="hint">บรรทัดละ 1 ตัวเลือก</span><textarea data-qo="${i}:${j}" rows="${Math.max(2, qq.options.length)}">${esc(qq.options.join("\n"))}</textarea></label>`}
      </div>`).join("")}
      <div><button class="small" data-qa="${i}">+ เพิ่มคำถาม</button></div></div>`;
  }).join("");
  const at = s => s.split(":").map(Number);
  box.querySelectorAll("[data-pt]").forEach(el => el.oninput = () => d.parts[+el.dataset.pt].title = el.value);
  box.querySelectorAll("[data-items]").forEach(el => el.oninput = () => {
    const p = d.parts[+el.dataset.items], lines = el.value.split("\n").map(s => s.trim()).filter(Boolean);
    p.items = lines.map((t, k) => ({id: p.items[k]?.id || "i" + rid(), text: t})); box.querySelector(`[data-cnt="${el.dataset.items}"]`).textContent = p.items.length;
  });
  box.querySelectorAll("[data-mv]").forEach(el => el.onclick = () => { const i = +el.dataset.mv, j = i + +el.dataset.dir; [d.parts[i], d.parts[j]] = [d.parts[j], d.parts[i]]; drawParts(); });
  box.querySelectorAll("[data-rm]").forEach(el => el.onclick = () => {
    if(el.dataset.arm !== "1"){ el.dataset.arm = "1"; el.textContent = "ยืนยัน"; el.classList.add("armed"); return; }
    d.parts.splice(+el.dataset.rm, 1); drawParts();
  });
  box.querySelectorAll("[data-qt]").forEach(el => el.onchange = () => { const [i,j] = at(el.dataset.qt), qq = d.parts[i].questions[j]; qq.type = el.value; if(qq.type !== "text" && !qq.options.length) qq.options = ["ตัวเลือก 1","ตัวเลือก 2"]; drawParts(); });
  box.querySelectorAll("[data-qx]").forEach(el => el.oninput = () => { const [i,j] = at(el.dataset.qx); d.parts[i].questions[j].text = el.value; });
  box.querySelectorAll("[data-qr]").forEach(el => el.onchange = () => { const [i,j] = at(el.dataset.qr); d.parts[i].questions[j].required = el.checked; });
  box.querySelectorAll("[data-qo]").forEach(el => el.oninput = () => { const [i,j] = at(el.dataset.qo); d.parts[i].questions[j].options = [...new Set(el.value.split("\n").map(s => s.trim()).filter(Boolean))]; });
  box.querySelectorAll("[data-qd]").forEach(el => el.onclick = () => { const [i,j] = at(el.dataset.qd); d.parts[i].questions.splice(j, 1); drawParts(); });
  box.querySelectorAll("[data-qa]").forEach(el => el.onclick = () => { d.parts[+el.dataset.qa].questions.push(q("single", "", ["ตัวเลือก 1","ตัวเลือก 2"])); drawParts(); });
}

      <div class="links" style="margin-top:8px">

/* ----- กราฟของแบบสอบถาม ----- */
function specsS(sv, res, theme, groupsRes){
  const max = sv.scale.points, pass = +sv.scale.pass || null, no = itemNo(sv);
  const tipOf = (name, s) => `<b>${esc(name)}</b><br>x̄ = ${f2(s.mean)} · S.D. = ${f2(s.sd)} · ${lv(sv, s.mean)}`;
  const parts = res.rp.length > 1 ? {kind: "v", max, ref: pass, width: 420, bars: [
    ...res.rp.map((p, i) => ({label: p.title.replace(/^ด้าน/, ""), value: res.parts[i].mean, color: theme.c[i % 6], tip: tipOf(p.title, res.parts[i])})),
    {label: "รวมทุกด้าน", value: res.total.mean, color: theme.total, tip: tipOf("รวมทุกด้าน", res.total)}]} : null;
  const itemsSpec = {kind: "h", max, ref: pass, width: 680, bars: res.rp.flatMap((p, i) => p.items.map(it => ({label: `${no[it.id]}. ${it.text}`, value: res.items[it.id].mean || 0, color: theme.c[i % 6], tip: tipOf(`${no[it.id]}. ${it.text}`, res.items[it.id])})))};
  const groups = groupsRes && groupsRes.length > 1 ? {kind: "v", max, ref: pass, width: 680, bars: groupsRes.map(([g, r]) => ({label: g, value: r.total.mean, color: theme.total, tip: tipOf(`${sv.groupLabel || "กลุ่ม"} ${g} (n = ${r.n})`, r.total)}))} : null;
  return {parts, items: itemsSpec, groups};
}

/* ----- ตาราง HTML ----- */
function htmlParts(sv, res, cap){
  return `<table class="report"><caption>${cap}</caption><thead><tr><th>ด้าน</th><th style="width:80px">x̄</th><th style="width:80px">S.D.</th><th style="width:110px">ระดับ</th></tr></thead><tbody>
    ${res.rp.map((p,i) => `<tr><td>${esc(p.title)}</td><td class="num">${f2(res.parts[i].mean)}</td><td class="num">${f2(res.parts[i].sd)}</td><td class="num">${lv(sv, res.parts[i].mean)}</td></tr>`).join("")}
    <tr class="total"><td>รวมทุกด้าน</td><td class="num">${f2(res.total.mean)}</td><td class="num">${f2(res.total.sd)}</td><td class="num">${lv(sv, res.total.mean)}</td></tr></tbody></table>`;
}
function htmlItems(sv, res, cap){
  const no = itemNo(sv), tr = (l, s, c = "") => `<tr class="${c}"><td>${l}</td><td class="num">${f2(s.mean)}</td><td class="num">${f2(s.sd)}</td><td class="num">${lv(sv, s.mean)}</td></tr>`;
  const multi = res.rp.length > 1; let b = "";
  res.rp.forEach((p, i) => {
    if(multi) b += `<tr class="dimrow"><td colspan="4">${esc(p.title)}</td></tr>`;
    p.items.forEach(it => b += tr(`${no[it.id]}. ${esc(it.text)}`, res.items[it.id]));
    if(multi) b += tr(`รวม${esc(p.title)}`, res.parts[i], "sum");
  });
  b += tr(multi ? "รวมทุกด้าน" : "รวม", res.total, "total");
  return `<table class="report"><caption>${cap}</caption><thead><tr><th>รายการประเมิน</th><th style="width:80px">x̄</th><th style="width:80px">S.D.</th><th style="width:110px">ระดับ</th></tr></thead><tbody>${b}</tbody></table>`;
}
function htmlInfo(sv, rows, withGroup){
  const n = rows.length, pct = v => n ? (v / n * 100).toFixed(2) : "0.00";
  const qs = allQuestions(sv).filter(qq => qq.type !== "text");
  let body = "";
  if(withGroup && sv.groupLabel){ const c = new Map(); rows.forEach(r => c.set(groupOf(r), (c.get(groupOf(r)) || 0) + 1));
    body += `<tr class="dimrow"><td colspan="3">${esc(sv.groupLabel)}</td></tr>` + [...c].sort((a,b) => thSort(a[0], b[0])).map(([k,v]) => `<tr><td>${esc(k)}</td><td class="num">${v}</td><td class="num">${pct(v)}</td></tr>`).join(""); }
  qs.forEach(qq => { const f = freqQ(rows, qq);
    body += `<tr class="dimrow"><td colspan="3">${esc(qq.text)}${qq.type === "multi" ? " (ตอบได้มากกว่า 1 ข้อ)" : ""}</td></tr>` + f.list.map(([k,v]) => `<tr><td>${esc(k)}</td><td class="num">${v}</td><td class="num">${pct(v)}</td></tr>`).join(""); });
  if(!body) return "";
  return `<table class="report"><caption><b>ตาราง</b> ข้อมูลทั่วไปของผู้ตอบ (n = ${n})</caption><thead><tr><th>ข้อมูลทั่วไป</th><th style="width:100px">จำนวน (คน)</th><th style="width:90px">ร้อยละ</th></tr></thead><tbody>${body}</tbody></table>`;
}

const compute2 = computeS;
function whoText(sv, g){ const a = sv.audience || "ผู้ตอบ"; return g ? `${a} ${sv.groupLabel || "กลุ่ม"} ${g} ` : `${a}`; }
function bindResultsTop(){
  $("#rsel").onchange = e => { A.sel = e.target.value; A.group = "__all"; renderResults(); };
  if($("#gsel")) $("#gsel").onchange = e => { A.group = e.target.value; renderResults(); };
}
function buildCSV(sv, rows){
  const no = itemNo(sv), qs = allQuestions(sv), its = ratingParts(sv).flatMap(p => p.items);
  const head = ["ลำดับ","วันที่ส่ง", ...(sv.groupLabel ? [sv.groupLabel] : []), ...qs.map(qq => qq.text), ...its.map(it => `ข้อ${no[it.id]} ${it.text}`)];
  const qv = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const body = rows.map((r,k) => [k+1, r.createdAt ? new Date(r.createdAt).toLocaleString("th-TH") : "", ...(sv.groupLabel ? [r.group] : []),
    ...qs.map(qq => { const a = r.answers?.[qq.id]; return Array.isArray(a) ? a.join("; ") : a ?? ""; }), ...its.map(it => r.ratings?.[it.id] ?? "")]);
  return new Blob(["﻿" + [head, ...body].map(r => r.map(qv).join(",")).join("\r\n")], {type: "text/csv;charset=utf-8"});
}

  const pick = a => a[Math.floor(Math.random() * a.length)], arr = [];

  [["ม.4/1",14,3.9],["ม.4/2",12,4.25],["ม.4/3",11,3.6]].forEach(([g, n, base]) => { for(let i = 0; i < n; i++){

    allQuestions(sv).forEach(qq => { if(qq.type === "single") answers[qq.id] = pick(qq.options); else if(qq.type === "multi") answers[qq.id] = [pick(qq.options)]; else if(Math.random() < .55) answers[qq.id] = pick(/ปรับปรุง/.test(qq.text) ? fix : good); });
    ratingParts(sv).forEach(p => p.items.forEach(it => ratings[it.id] = Math.max(1, Math.min(sv.scale.points, Math.round(b + (Math.random() - .5) * 1.4)))));

/* ----- รายงาน Word / PDF ของแบบสอบถาม ----- */
function buildReportS(sv, rows, opt = {cmp: true, rooms: true}, fmt = "docx"){
  const K = fmt === "html" ? HTMLKIT : DOCXKIT, para = K.para, run = K.run, wtable = K.table, pageBreak = K.pb;
  let tno = 0, fno = 0; const media = [], no = itemNo(sv), W_ = sv.scale.word, gl = sv.groupLabel || "กลุ่ม";
  const figure = (spec, title, w, inch) => { if(!spec) return ""; const png = chartPNG({...spec, width: w}), id = media.length + 1; media.push(png.data);
    return K.img(png, id, inch) + para([run(`ภาพที่ ${++fno} `, {b: true}), run(title)], {align: "center", after: 160}); };
  const cap = text => para([run(`ตารางที่ ${++tno} `, {b: true}), run(text)], {keep: true, after: 60, before: 120});
  const H1 = t => para(t, {b: true, sz: 36, before: 240, after: 120, keep: true});
  const H2 = t => para(t, {b: true, before: 180, after: 60, keep: true});
  const W4 = [4706, 1100, 1100, 1400];
  const row4 = (label, s, extra = {}) => ({...extra, cells: [C(label), N(f2(s.mean)), N(f2(s.sd)), N(lv(sv, s.mean))]});
